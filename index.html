// Red string connecting the cases in order
function drawString() {
  const city = $('#city');
  const svg = $('#string');
  if (!city || !svg) return;
  const box = city.getBoundingClientRect();
  const pts = $$('[data-loc]', city).map((el) => {
    const r = el.getBoundingClientRect();
    return [r.left - box.left + r.width / 2, r.top - box.top + Math.min(26, r.height / 2)];
  });
  svg.setAttribute('width', box.width);
  svg.setAttribute('height', box.height);
  svg.innerHTML = pts.length > 1
    ? `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="#B3170F" stroke-width="3"/>`
    : '';
}

// ---------- One case --------------------------------------------------------
async function studentCase(id) {
  const isT = me.role === 'teacher';
  loadingPage(isT ? 'cases' : 'map');
  try {
    const [{ data: c, error }, { data: sub }] = await Promise.all([
      sb.from('challenges').select('*').eq('id', id).maybeSingle(),
      isT ? Promise.resolve({ data: null }) : sb.from('submissions').select('*').eq('challenge_id', id).eq('student_id', me.id).maybeSingle(),
    ]);
    if (error) throw error;
    if (!c) { location.hash = isT ? '#/cases' : '#/map'; return; }

    const slides = slidesFor(c);
    const tags = slideTags(slides);
    const prompts = Array.isArray(c.prompts) && c.prompts.length ? c.prompts : DEFAULT_PROMPTS;
    const d = districtOf(c.district);
    const st = caseState(sub);
    const editable = !isT && !me.viewing && (!sub || sub.status === 'try_again');
    const checkKey = `l2l-check-${me.id}-${c.id}`;
    const passed = new Set(store(checkKey) || []);
    const checks = slides.map((s, i) => (s.type === 'check' ? i : -1)).filter((i) => i >= 0);
    const unlocked = () => !!sub || isT || checks.every((i) => passed.has(i));
    const lockKey = `l2l-locks-${me.id}-${c.id}`;
    const opened = new Set(store(lockKey) || []);
    const lockIdx = slides.map((s, i) => (s.type === 'lock' ? i : -1)).filter((i) => i >= 0);
    const isOpen = (i) => isT || !!sub || opened.has(slides[i].id);
    const lockReady = (i) => lockIdx.filter((j) => j < i).every(isOpen);
    const lockForm = (i) => (isOpen(i) ? '<p class="lock-msg"><b class="ok-text">Lock cracked.</b></p>'
      : lockReady(i) ? `<form class="lock-form" data-lockform="${i}" autocomplete="off">
          <label for="code-${i}">Enter the code</label>
          <div class="lock-row"><input id="code-${i}" class="code-in" maxlength="40" autocapitalize="characters" spellcheck="false" placeholder="${'_ '.repeat(Math.min(12, slides[i].codeLen || 4)).trim()}">
          <button class="stamp-btn">Try code</button>${slides[i].hint ? `<button type="button" class="link-btn" data-hint="${i}">Need a hint?</button>` : ''}</div>
          <p class="lock-msg" id="lm-${i}" aria-live="polite"></p></form>`
      : '<p class="lock-msg muted">Crack the lock above first.</p>');

    const phaseOf = (s) => SLIDE_TYPES[s.type]?.phase;
    const inPhase = (p) => slides.map((s, i) => ({ s, i })).filter(({ s }) => phaseOf(s) === p);
    const frames = (items) => items.map(({ s, i }) => (s.type === 'lock'
      ? `<div class="lock-wrap" data-lock="${i}">${slideFrame(s, c, { mode: 'student', tag: tags[i], open: isOpen(i) })}${lockForm(i)}</div>`
      : s.type === 'check'
      ? `<div class="check-wrap" data-check="${i}">${slideFrame(s, c, { mode: 'student', tag: tags[i], interactive: !passed.has(i) && !sub, reveal: passed.has(i) || !!sub })}
          <p class="check-msg" id="cm-${i}" aria-live="polite">${passed.has(i) || sub ? '<b class="ok-text">Intel confirmed.</b>' : 'Tap an answer.'}</p></div>`
      : slideFrame(s, c, { mode: 'student', tag: tags[i] }))).join('');

    const hook = inPhase('hook');
    const intel = inPhase('intel');
    const inv = inPhase('investigate');
    const deb = inPhase('debrief');
    const steps = Array.isArray(c.steps) ? c.steps : [];

    const urls = await signUrls(sub ? [sub] : []);
    const crewHtml = isT ? '' : await crewCard(c.week || 0);
    const verdict = sub && (sub.feedback || sub.sticker || sub.status !== 'submitted') ? verdictCard(sub, c) : '';
    const phases = [['hook', 'Hook', hook.length], ['intel', 'Intel', intel.length], ['investigate', 'Investigate', inv.length || steps.length], ['debrief', 'Debrief', deb.length], ['capture', 'Capture', 1]].filter((p) => p[2]);

    shell(isT ? 'cases' : 'map', `
      <div class="case-top">
        <a class="back" href="${isT ? `#/edit/${c.id}` : `#/map/${c.district || 1}`}">← ${isT ? 'Back to the Case Builder' : 'Back to the city map'}</a>
        <span class="label-black small">CASE #${pad2(c.week || 0)}${c.location ? ` · ${esc(c.location.toUpperCase())}` : ''}</span>
      </div>
      ${isT ? '<p class="memo slim">Teacher preview: this is what students see. Checks are unlocked for you.</p>' : ''}
      <section class="paper case-head ${c.boss ? 'boss' : ''}">
        ${!isT ? `<span class="stamp-mark ${st}">${STATE_LABEL[st]}</span>` : ''}
        <p class="eyebrow">DISTRICT ${d.n} · ${esc(d.name.toUpperCase())}${c.boss ? ' · BOSS CASE' : ''} · +${c.xp} XP</p>
        <h1>${esc(c.title)}</h1>
        ${c.message ? `<p class="case-msg">${esc(c.message)}</p>` : ''}
        ${c.element ? `<p class="element">${esc(c.element)}</p>` : ''}
      </section>
      ${Array.isArray(c.intentions) && c.intentions.length ? `<section class="paper objectives"><p class="eyebrow">MISSION OBJECTIVES</p><p>By the end of this case you can:</p><ul>${c.intentions.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section>` : ''}
      ${verdict}
      ${crewHtml}
      ${Array.isArray(c.files) && c.files.some((f) => isT || !f.teacher) ? `<section class="paper case-files"><p class="eyebrow">CASE FILES</p><div class="file-btns">${c.files.map((f, i) => (!isT && f.teacher ? '' : `<button type="button" class="file-btn" data-file="${i}"><span class="file-ico">${esc(extOf(f.name).toUpperCase() || 'FILE')}</span>${esc(f.name)}${f.teacher ? ' <span class="chip">teacher only</span>' : ''}</button>`)).join('')}</div></section>` : ''}
      <nav class="phase-nav" aria-label="Case progress">
        ${phases.map(([k, l], i) => `<a href="#ph-${k}" data-phase="${k}"><b>${i + 1}</b> ${l}</a>`).join('')}
      </nav>
      ${hook.length ? `<section class="phase" id="ph-hook"><h2 class="phase-title">Hook</h2>${frames(hook)}</section>` : ''}
      ${intel.length ? `<section class="phase" id="ph-intel"><div class="phase-band"><h2>Intel · top secret training</h2><p>This is the lesson. Reread it any time.</p></div>${frames(intel)}</section>` : ''}
      ${inv.length || steps.length ? `<section class="phase ${unlocked() ? '' : 'locked'}" id="ph-investigate">
        <h2 class="phase-title">Investigate</h2>
        <p class="lock-note" ${unlocked() ? 'hidden' : ''}>Locked. Answer the intel check${checks.length > 1 ? 's' : ''} above to open the investigation.</p>
        <div class="phase-body">${frames(inv)}
        ${steps.length ? `<section class="paper lines"><p class="eyebrow">LINES OF INQUIRY</p><ol class="inquiry">${steps.map((s2, i) => `<li><label><input type="checkbox" data-step="${i}" ${(store(`l2l-steps-${me.id}-${c.id}`) || []).includes(i) ? 'checked' : ''} ${isT ? 'disabled' : ''}><span>${esc(s2)}</span></label></li>`).join('')}</ol></section>` : ''}
        </div></section>` : ''}
      ${deb.length ? `<section class="phase" id="ph-debrief"><h2 class="phase-title">Debrief</h2>${frames(deb)}</section>` : ''}
      <section class="phase" id="ph-capture">
        <div class="phase-band"><h2>Capture · your own case file</h2><p>Private: only you and your teachers can see this. It goes into your portfolio.</p></div>
        <div id="capture"></div>
      </section>`);

    fitSlides();
    // phase nav highlight
    const io = new IntersectionObserver((ents) => ents.forEach((e) => {
      if (e.isIntersecting) $$('.phase-nav a').forEach((a) => a.classList.toggle('on', a.dataset.phase === e.target.id.slice(3)));
    }), { rootMargin: '-40% 0px -55% 0px' });
    $$('.phase').forEach((p) => io.observe(p));

    // interactive checks
    $$('.check-wrap').forEach((w) => {
      const i = Number(w.dataset.check);
      w.addEventListener('click', (e) => {
        const b = e.target.closest('[data-opt]');
        if (!b || passed.has(i) || sub || isT) return;
        const pick = Number(b.dataset.opt);
        const s = slides[i];
        const right = pick === Number(s.answer);
        if (right) { passed.add(i); store(checkKey, [...passed]); }
        w.querySelector('.slide-frame').innerHTML = renderSlide(s, c, { mode: 'student', tag: tags[i], interactive: !right, reveal: right, picked: pick });
        $(`#cm-${i}`).innerHTML = right ? '<b class="ok-text">Intel confirmed.</b>' : '<b class="bad-text">Not quite.</b> Reread the intel above and try again.';
        if (right && unlocked()) {
          const ph = $('#ph-investigate');
          if (ph) { ph.classList.remove('locked'); $('.lock-note', ph).hidden = true; }
          toast('Investigation unlocked');
        }
      });
    });
    // case files: private, so each download gets a short-lived link
    $$('[data-file]').forEach((btn) => btn.addEventListener('click', async () => {
      const f = c.files[Number(btn.dataset.file)];
      if (!f) return;
      if (f.url) { window.open(f.url, '_blank', 'noopener'); return; }
      const w = window.open('', '_blank');
      const { data, error } = await sb.storage.from('resources').createSignedUrl(f.path, 600);
      if (error || !data?.signedUrl) { w?.close(); return toast('That file couldn’t be opened. Tell your teacher.', 'warn'); }
      if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
    }));
    // padlocks
    const wireLocks = () => {
      $$('[data-lockform]').forEach((f) => f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const i = Number(f.dataset.lockform);
        const s = slides[i];
        const val = $('.code-in', f).value;
        if (!normCode(val)) return;
        const ok = s.codeHash && (await codeHash(s.id, val)) === s.codeHash;
        const msg = $(`#lm-${i}`);
        if (!ok) {
          msg.innerHTML = '<b class="bad-text">Not the code.</b> Check your clues and try again.';
          f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
          return;
        }
        opened.add(s.id);
        if (me.viewing) toast('Right code. (Student view: not saved to her crew.)');
        else {
          store(lockKey, [...opened]);
          toast('Lock cracked!');
          sb.rpc('record_crack', { p_challenge: c.id, p_slide: s.id, p_code: val }).then(() => {});
        }
        lockIdx.forEach((j) => {
          const w = $(`[data-lock="${j}"]`);
          if (!w) return;
          w.innerHTML = slideFrame(slides[j], c, { mode: 'student', tag: tags[j], open: isOpen(j) }) + lockForm(j);
        });
        fitSlides();
        wireLocks();
      }));
      $$('[data-hint]').forEach((b) => b.addEventListener('click', () => {
        const i = Number(b.dataset.hint);
        $(`#lm-${i}`).innerHTML = `<span class="hint-box"><b>Hint:</b> ${esc(slides[i].hint)}</span>`;
      }));
    };
    wireLocks();
    $$('[data-step]').forEach((cb) => cb.addEventListener('change', () => {
      const key = `l2l-steps-${me.id}-${c.id}`;
      const set = new Set(store(key) || []);
      if (cb.checked) set.add(Number(cb.dataset.step)); else set.delete(Number(cb.dataset.step));
      store(key, [...set]);
    }));

    if (isT) {
      $('#capture').innerHTML = `<section class="paper"><p class="eyebrow">EVIDENCE BOARD</p><p>${esc(c.capture_ask || 'Students upload up to 3 photos or files here.')}</p>
        <p class="eyebrow">CASE NOTES</p><ol>${prompts.map((p) => `<li>${esc(p)}</li>`).join('')}</ol></section>`;
      return;
    }
    if (me.viewing && !sub) {
      $('#capture').innerHTML = `<section class="paper"><p class="eyebrow">EVIDENCE BOARD</p>
        <p><b>${esc(me.display_name)} hasn’t filed this case yet.</b> When she does, her photos and case notes show here.</p>
        <p class="muted">In her own login this is where she uploads up to 3 photos or files and answers:</p><ol>${prompts.map((p) => `<li>${esc(p)}</li>`).join('')}</ol></section>`;
      return;
    }
    if (!editable) {
      $('#capture').innerHTML = `<section class="paper">
        <p class="eyebrow">MY EVIDENCE</p>${evidenceHtml(sub.evidence, urls, sub.link) || '<p class="muted">No evidence attached.</p>'}
        <p class="eyebrow">MY CASE NOTES</p>
        ${prompts.map((p, i) => `<h3 class="q">${esc(p)}</h3><p class="a">${esc(sub.answers?.[i] || '')}</p>`).join('')}
        <p class="muted">${sub.status === 'approved' ? 'Case closed.' : 'Filed. Waiting for your teacher to read it.'}</p></section>`;
      return;
    }
    captureForm(c, sub, prompts, urls);
  } catch (e) { errorPage(me.role === 'teacher' ? 'cases' : 'map', e); }
}

function captureForm(c, sub, prompts, urls) {
  const kept = [...(sub?.evidence || [])];
  const removed = [];
  const pending = [];
  const answers = sub?.answers || [];
  const label = sub ? 'Re-file my case notes' : 'File my case notes';
  $('#capture').innerHTML = `
    <form id="cap-form" novalidate>
      <section class="paper pinned">
        <p class="eyebrow">EVIDENCE BOARD</p>
        <h2>Pin your evidence</h2>
        <p>${esc(c.capture_ask || 'Upload a photo of your work, or the file itself.')}</p>
        <div class="evidence-board" id="ev-grid"></div>
        <input type="file" id="ev-input" class="sr" multiple accept="${ACCEPT}">
        <label for="ev-input" class="dropzone" id="dropzone"><b>+ Add photo or file</b><span class="muted small">Photos, PDF, Word or PowerPoint · up to ${MAX_FILES}</span></label>
        <label for="link">Or add a link <span class="muted">(OneDrive, Canva, a website…)</span></label>
        <input id="link" type="url" inputmode="url" placeholder="https://…" value="${esc(sub?.link || '')}">
      </section>
      <section class="paper lined-card locked" id="notes">
        <p class="eyebrow">CASE NOTES · REFLECTION</p>
        <h2>Write up the case</h2>
        <p class="lock-note">Pin your evidence first to unlock your case notes.</p>
        ${prompts.map((p, i) => `<label for="a${i}">${i + 1} · ${esc(p)}</label>
          <textarea id="a${i}" class="lined" rows="4" maxlength="2000">${esc(answers[i] || '')}</textarea>`).join('')}
        <div class="row-actions">
          <button class="stamp-btn big" type="submit" id="file-it">${label}</button>
          <span class="muted">+${c.xp} XP when your teacher closes the case</span>
        </div>
      </section>
    </form>`;

  const grid = $('#ev-grid');
  const linkInput = $('#link');
  const hasEvidence = () => kept.length + pending.length > 0 || safeUrl(linkInput.value.trim());
  const tilt = [-3, 2, -1.5];
  function refresh() {
    grid.innerHTML = [
      ...kept.map((e, i) => {
        const u = urls[e.path];
        const inner = u && showsAsImage(e.type) ? `<img src="${esc(u)}" alt="${esc(e.name)}">` : `<span class="ev-doc"><b>${fileTag(e.type)}</b><small>${esc(e.name)}</small></span>`;
        return `<div class="polaroid" style="--t:${tilt[i % 3]}deg">${inner}<span class="ev-cap">${esc(e.name)}</span><button type="button" class="ev-x" data-kept="${i}" aria-label="Remove ${esc(e.name)}">✕</button></div>`;
      }),
      ...pending.map((p, i) => {
        const inner = p.preview ? `<img src="${p.preview}" alt="${esc(p.file.name)}">` : `<span class="ev-doc"><b>${fileTag(mimeFor(p.file))}</b><small>${esc(p.file.name)}</small></span>`;
        return `<div class="polaroid pop" style="--t:${tilt[(kept.length + i) % 3]}deg">${inner}<span class="ev-cap">${esc(p.file.name)}</span><button type="button" class="ev-x" data-pending="${i}" aria-label="Remove ${esc(p.file.name)}">✕</button></div>`;
      }),
    ].join('');
    const full = kept.length + pending.length >= MAX_FILES;
    $('#dropzone').classList.toggle('full', full);
    $('#ev-input').disabled = full;
    const ok = !!hasEvidence();
    $('#notes').classList.toggle('locked', !ok);
    $$('#notes textarea, #file-it').forEach((el) => { el.disabled = !ok; });
  }
  function addFiles(list) {
    for (const file of list) {
      if (kept.length + pending.length >= MAX_FILES) { toast(`Up to ${MAX_FILES} files per case.`, 'warn'); break; }
      if (!FILE_TYPES[extOf(file.name)]) { toast(`${file.name} isn’t a photo, PDF, Word or PowerPoint file.`, 'warn'); continue; }
      const big = showsAsImage(mimeFor(file)) && mimeFor(file) !== 'image/gif' ? 25 * 1024 * 1024 : MAX_BYTES;
      if (file.size > big) { toast(`${file.name} is too big (max 5 MB).`, 'warn'); continue; }
      pending.push({ file, preview: showsAsImage(mimeFor(file)) ? URL.createObjectURL(file) : null });
    }
    refresh();
  }
  $('#ev-input').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  const dz = $('#dropzone');
  dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer.files); });
  grid.addEventListener('click', (e) => {
    const b = e.target.closest('.ev-x');
    if (!b) return;
    if (b.dataset.kept !== undefined) removed.push(...kept.splice(Number(b.dataset.kept), 1));
    else pending.splice(Number(b.dataset.pending), 1);
    refresh();
  });
  linkInput.addEventListener('input', refresh);
  refresh();

  $('#cap-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#file-it');
    if (!hasEvidence()) return toast('Pin your evidence first.', 'warn');
    const link = linkInput.value.trim();
    if (link && !safeUrl(link)) return toast('Links need to start with https://', 'warn');
    const vals = prompts.map((_, i) => $(`#a${i}`).value.trim());
    if (vals.some((v) => v.length < 3)) return toast('Answer every case-notes question first.', 'warn');
    btn.disabled = true;
    const uploaded = [];
    try {
      for (const [i, p] of pending.entries()) {
        btn.textContent = `Uploading ${i + 1} of ${pending.length}…`;
        const f = await shrinkImage(p.file);
        if (f.size > MAX_BYTES) throw new Error(`${p.file.name} is too big (max 5 MB).`);
        const ext = extOf(f.name).replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
        const path = `${me.id}/${c.id}/${uid()}.${ext}`;
        const { error: upErr } = await sb.storage.from('evidence').upload(path, f, { contentType: f.type });
        if (upErr) throw upErr;
        uploaded.push({ path, name: p.file.name.slice(0, 80), type: f.type, size: f.size });
      }
      btn.textContent = 'Filing…';
      const payload = { answers: vals, link: link || null, evidence: [...kept, ...uploaded] };
      const { error: err } = sub
        ? await sb.from('submissions').update({ ...payload, status: 'submitted' }).eq('id', sub.id)
        : await sb.from('submissions').insert({ ...payload, challenge_id: c.id, student_id: me.id });
      if (err) throw err;
      if (removed.length) await sb.storage.from('evidence').remove(removed.map((r) => r.path));
      await stampOverlay('CASE FILED', `“${c.title}” is on your teacher’s desk.`, `+${c.xp} XP when she closes the case`);
      location.hash = '#/portfolio';
    } catch (err) {
      if (uploaded.length) await sb.storage.from('evidence').remove(uploaded.map((u) => u.path));
      btn.disabled = false;
      btn.textContent = label;
      toast(friendlyError(err), 'warn');
    }
  });
}

function verdictCard(sub, c) {
  const st = stickerOf(sub.sticker);
  const closed = sub.status === 'approved';
  const reopened = sub.status === 'try_again';
  const msg = closed ? (c?.closed_msg || 'Case closed, detective.') : reopened ? (c?.reopen_msg || 'Nearly there. Improve it and re-file.') : '';
  if (!closed && !reopened && !sub.feedback && !st) return '';
  return `<section class="verdict ${sub.status}">
    ${closed ? '<span class="stamp-mark closed">CASE CLOSED</span>' : reopened ? '<span class="stamp-mark reopened">REOPENED</span>' : ''}
    ${msg ? `<p class="verdict-msg">${esc(msg)}</p>` : ''}
    ${sub.feedback ? `<p class="verdict-fb"><b>${esc(sub.reviewer_name || 'Your teacher')}:</b> ${esc(sub.feedback)}</p>` : ''}
    ${st ? `<p class="badge-line">${graphicSvg(st.g, 'badge-ic')}<b>${esc(st.label)}</b> badge</p>` : ''}
    ${sub.bonus ? `<p class="bonus">+${sub.bonus} bonus XP for strong case notes</p>` : ''}
  </section>`;
}

async function studentPortfolio(studentId) {
  const isT = me.role === 'teacher';
  if (isT && !studentId) { location.hash = '#/class'; return; }
  loadingPage(isT ? 'class' : 'portfolio');
  try {
    let who = me;
    let nav = '';
    if (isT) {
      const students = await loadStudents();
      who = students.find((x) => x.id === studentId);
      if (!who) { location.hash = '#/class'; return; }
      const mates = students.filter((x) => x.mentor_group === who.mentor_group);
      const i = mates.findIndex((x) => x.id === who.id);
      const prev = mates[i - 1]; const next = mates[i + 1];
      nav = `<div class="folio-nav"><a class="back" href="#/class">← Class</a>
        <span class="muted">${esc(who.display_name)}’s portfolio${who.mentor_group ? ` · ${esc(who.mentor_group)}` : ''}</span>
        <button class="stamp-btn small" data-viewas="${who.id}">Open her student view</button>
        <span class="folio-step">${prev ? `<a class="stamp-btn small ghost" href="#/portfolio/${prev.id}">← ${esc(prev.display_name)}</a>` : ''}${next ? `<a class="stamp-btn small ghost" href="#/portfolio/${next.id}">${esc(next.display_name)} →</a>` : ''}</span></div>`;
    } else await refreshMe();
    const subs = await loadMySubmissions(who.id);
    const urls = await signUrls(subs);
    const badges = subs.filter((s) => s.sticker).map((s) => stickerOf(s.sticker)).filter(Boolean);
    const closed = subs.filter((s) => s.status === 'approved').length;
    const seen = isT ? {} : (store(`l2l-fb-${me.id}`) || {});
    const groups = DISTRICTS.map((d) => ({ d, items: subs.filter((s) => (s.challenge?.district || 1) === d.n).sort((a, b) => byWeek(a.challenge || {}, b.challenge || {})) })).filter((g) => g.items.length);

    shell(isT ? 'class' : 'portfolio', `${nav}
      <div class="folio">
        <aside class="paper dossier pinned">
          <p class="eyebrow">DETECTIVE DOSSIER</p>
          <h1>${esc(who.display_name)}</h1>
          <p class="dossier-rank">${esc(rankOf(who.xp))}${who.mentor_group ? ` · ${esc(who.mentor_group)}` : ''}</p>
          <div class="xp-box"><div><b>${who.xp} XP</b><span>Level ${levelOf(who.xp)}</span></div>
            <span class="hud-bar big"><i style="width:${intoLevel(who.xp)}%"></i></span>
            <small>${XP_PER_LEVEL - intoLevel(who.xp)} XP to level ${levelOf(who.xp) + 1}</small></div>
          <p class="eyebrow ink">CASE RECORD</p>
          <p class="record"><b>${subs.length}</b> filed · <b>${closed}</b> closed</p>
          <p class="eyebrow ink">BADGES</p>
          <div class="badges">${badges.length ? badges.map((b) => `<span class="badge" title="${esc(b.label)}">${graphicSvg(b.g)}<small>${esc(b.label)}</small></span>`).join('') : `<p class="muted small">${isT ? 'No badges yet.' : 'Your teacher awards badges when she closes your cases.'}</p>`}</div>
        </aside>
        <div class="files">
          <h1 class="files-title">${isT ? `${esc(who.display_name)}’s case files` : 'My case files'}</h1>
          ${groups.length ? groups.map(({ d, items }) => `
            <h2 class="district-label" style="--dc:${d.col}">District ${d.n} · ${esc(d.name)}</h2>
            ${items.map((s, i) => {
              const c = s.challenge || {};
              const st = caseState(s);
              const isNew = !isT && s.reviewed_at && seen[s.id] !== s.reviewed_at;
              const prompts = c.prompts || DEFAULT_PROMPTS;
              return `<article class="paper case-file" style="--t:${i % 2 ? 0.4 : -0.4}deg">
                <span class="stamp-mark ${st}">${STATE_LABEL[st]}</span>
                <p class="eyebrow">CASE #${pad2(c.week || 0)} · ${fmtDate(s.created_at)}${isNew ? ' · <span class="hot">NEW FEEDBACK</span>' : ''}${isT && s.status === 'submitted' ? ' · <a href="#/review">waiting for review</a>' : ''}</p>
                <h3><a href="#/case/${s.challenge_id}">${esc(c.title || 'Case')}</a></h3>
                <div class="file-body">
                  ${evidenceHtml(s.evidence, urls, s.link)}
                  <div class="file-notes">
                    ${prompts.slice(0, 2).map((p, k) => `<p class="q small">${esc(p)}</p><p class="a">${esc(s.answers?.[k] || '')}</p>`).join('')}
                    ${prompts.length > 2 ? `<details><summary>All case notes</summary>${prompts.slice(2).map((p, k) => `<p class="q small">${esc(p)}</p><p class="a">${esc(s.answers?.[k + 2] || '')}</p>`).join('')}</details>` : ''}
                    ${s.feedback ? `<p class="memo fb"><b>${esc(s.reviewer_name || 'Your teacher')}:</b> ${esc(s.feedback)}</p>` : ''}
                  </div>
                </div>
              </article>`;
            }).join('')}`).join('')
            : `<section class="paper"><p>${isT ? 'She hasn’t filed any cases yet.' : 'Your case files appear here as you file them. <a href="#/map">Open the city map →</a>'}</p></section>`}
          <section class="exhibition"><b>◆ THRIVE Exhibition</b><span>Your best case files across the year become your Exhibition display.</span></section>
        </div>
      </div>`);
    if (!isT && !me.viewing) {
      subs.forEach((s) => { if (s.reviewed_at) seen[s.id] = s.reviewed_at; });
      store(`l2l-fb-${me.id}`, seen);

// ---------- Celebrations ------------------------------------------------------
function stampOverlay(stamp, line, small = '') {
  return new Promise((resolve) => {
    overlay.innerHTML = `
      <div class="stamp-dialog" role="dialog" aria-modal="true" aria-labelledby="sd-t">
        <span class="big-stamp ${reduceMotion ? '' : 'thud'}" id="sd-t">${esc(stamp)}</span>
        <p class="sd-line">${esc(line)}</p>
        ${small ? `<p class="sd-small">${esc(small)}</p>` : ''}
        <button class="stamp-btn" id="sd-ok">Back to work</button>
      </div>`;
    overlay.hidden = false;
    $('#sd-ok').focus();
    $('#sd-ok').addEventListener('click', () => { overlay.hidden = true; overlay.innerHTML = ''; resolve(); });
  });
}

function celebrateBonuses(subs) {
  const key = `l2l-closed-${me.id}`;
  const seen = store(key) || [];
  const fresh = subs.filter((s) => s.status === 'approved' && !seen.includes(s.id));
  if (!fresh.length) return;
  store(key, [...seen, ...fresh.map((s) => s.id)]);
  const xp = fresh.reduce((a, s) => a + (s.xp_awarded || 0) + (s.bonus || 0), 0);
  const names = fresh.map((s) => s.challenge?.title).filter(Boolean).join(', ');
  stampOverlay('CASE CLOSED', names, `+${xp} XP · you're now ${rankOf(me.xp)}, level ${levelOf(me.xp)}`);
}

function reviewCard(s, urls, draft) {
  const prompts = s.challenge?.prompts || DEFAULT_PROMPTS;
  const useDraft = draft && !s.feedback && s.status === 'submitted';
  const stale = useDraft && new Date(s.updated_at) > new Date(draft.drafted_for);
  return `<article class="paper review" data-id="${s.id}">
    <div class="review-head">
      <div><p class="eyebrow">CASE #${pad2(s.challenge?.week || 0)} · ${esc(s.challenge?.title)} · ${fmtDate(s.updated_at)}</p>
      <h2><a href="#/portfolio/${s.student_id}" title="Open her portfolio">${esc(s.student?.display_name)}</a> <span class="muted small">· ${esc(s.student?.mentor_group || 'No group')}</span></h2></div>
      ${s.status !== 'submitted' ? `<span class="stamp-mark ${s.status === 'approved' ? 'closed' : 'reopened'}">${s.status === 'approved' ? 'CASE CLOSED' : 'REOPENED'}</span>` : `<span class="xp-chip">+${s.xp_awarded} XP</span>`}
    </div>
    <p class="eyebrow ink">EVIDENCE</p>
    ${evidenceHtml(s.evidence, urls, s.link) || '<p class="muted">No evidence attached.</p>'}
    <p class="eyebrow ink">CASE NOTES</p>
    <div class="answers">${prompts.map((p, i) => `<p class="q">${esc(p)}</p><p class="a">${esc(s.answers?.[i] || '')}</p>`).join('')}</div>
    <label for="fb-${s.id}">Your feedback <span class="muted small">· she’ll see it from ${esc(me.display_name || 'you')}</span></label>
    ${useDraft ? `<p class="draft-note">✦ Draft written by Claude (AI). Read it, change anything that doesn’t sound like you, then send.${stale ? ' <b>She has edited her case notes since this draft was written.</b>' : ''}</p>` : ''}
    <textarea id="fb-${s.id}" class="${useDraft ? 'is-draft' : ''}" rows="${useDraft ? 4 : 3}" maxlength="2000" placeholder="What did she do well? What’s one next step?">${esc(s.feedback || (useDraft ? draft.draft : ''))}</textarea>
    <fieldset class="badge-pick"><legend>Award a badge <span class="muted">(optional)</span></legend>
      ${STICKERS.map((st) => `<label><input type="radio" name="st-${s.id}" value="${st.id}" ${s.sticker === st.id ? 'checked' : ''}><span>${graphicSvg(st.g)}${esc(st.label)}</span></label>`).join('')}
      <label><input type="radio" name="st-${s.id}" value="" ${!s.sticker ? 'checked' : ''}><span>None</span></label>
    </fieldset>
    <label class="check"><input type="checkbox" class="strong" ${s.bonus ? 'checked' : ''}> Strong case notes (+${STRONG_BONUS} bonus XP)</label>
    <div class="row-actions">
      <button class="stamp-btn green" data-act="approved">Close case</button>
      <button class="stamp-btn ghost" data-act="try_again">Reopen case</button>
    </div>
  </article>`;
}

function wireReview(card) {
  const id = card.dataset.id;
  $$('[data-act]', card).forEach((btn) => btn.addEventListener('click', async () => {
    const status = btn.dataset.act;
    const feedback = $(`#fb-${id}`, card).value.trim();
    if (status === 'try_again' && !feedback) return toast('Add a note so she knows what to improve.', 'warn');
    const sticker = $(`input[name="st-${id}"]:checked`, card)?.value || null;
    const strong = $('.strong', card).checked && status === 'approved';
    btn.disabled = true;
    const { error } = await sb.from('submissions').update({
      status, feedback: feedback || null, sticker,
      bonus: strong ? STRONG_BONUS : 0,
      reviewed_by: me.id, reviewed_at: new Date().toISOString(),
    }).eq('id', id);
    if (error) { btn.disabled = false; return toast(friendlyError(error), 'warn'); }
    sb.from('feedback_drafts').delete().eq('submission_id', id).then(() => {});
    toast(status === 'approved' ? 'Case closed' : 'Case reopened for another go');
    card.classList.add('leaving');
    setTimeout(() => card.remove(), reduceMotion ? 0 : 400);
  }));
}

async function caseBuilder(id, extra) {
  loadingPage('cases', { wide: true });
  try {
    let c;
    if (id === 'new' || !id) {
      const { data: all } = await sb.from('challenges').select('week').order('week', { ascending: false }).limit(1);
      c = {
        title: 'New case', brief: '', element: null, xp: 50, active: false, steps: [], prompts: DEFAULT_PROMPTS,
        week: Math.min(50, (all?.[0]?.week || 1) + 1), boss: false, district: Number(extra) || 1, location: '', message: '',
        closed_msg: 'Case closed, detective.', reopen_msg: 'Nearly there. Have another look and re-file.', capture_ask: '', slides: [], intentions: [], files: [],
      };
      c.slides = [newSlide('title', c), newSlide('objectives', c), newSlide('hook', c), newSlide('intel', c), newSlide('check', c), newSlide('investigate', c), newSlide('debrief', c), newSlide('capture', c)];
    } else {
      const { data, error } = await sb.from('challenges').select('*').eq('id', id).maybeSingle();
      if (error) throw error;
      if (!data) { location.hash = '#/cases'; return; }
      c = data;
      c.slides = clone(slidesFor(c));
      const { data: codes } = await sb.from('lock_codes').select('slide_id, code').eq('challenge_id', c.id);
      (codes || []).forEach((r) => { const s = c.slides.find((x) => x.id === r.slide_id); if (s) s.code = r.code; });
    }
    const waiting = await waitingCount();
    buildEditor(c, waiting);
  } catch (e) { errorPage('cases', e); }
}

    markDirty(); paintStrip(); paintEditor();
  };
  $('#strip').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.pick !== undefined) { sel = Number(d.pick); selSticker = -1; paintStrip(); paintEditor(); $('#editor').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); }
    if (d.left !== undefined) move(Number(d.left), Number(d.left) - 1);
    if (d.right !== undefined) move(Number(d.right), Number(d.right) + 1);
    if (d.dup !== undefined) {
      const i = Number(d.dup);
      const copy = clone(c.slides[i]);
      copy.id = uid();
      c.slides.splice(i + 1, 0, copy);
      sel = i + 1; selSticker = -1;
      markDirty(); paintStrip(); paintEditor();
      toast(`Slide ${i + 1} copied. Now edit the copy.`);
    }
    if (d.del !== undefined) {
      const i = Number(d.del);
      if (c.slides.length === 1) return toast('A case needs at least one slide.', 'warn');
      if (!confirm(`Delete slide ${i + 1} (${SLIDE_TYPES[c.slides[i].type]?.label})?`)) return;
      c.slides.splice(i, 1);
      sel = Math.min(sel, c.slides.length - 1); selSticker = -1;
      markDirty(); paintStrip(); paintEditor();
    }
    if (b.id === 'add-btn') {
      const m = $('#add-menu');
      m.hidden = !m.hidden;
      b.setAttribute('aria-expanded', String(!m.hidden));
    }
    if (d.add) {
      const s = newSlide(d.add, c);
      // new intel goes after the last intel-type slide, others after the selected slide
      let at = sel + 1;
      if (['intel', 'picture', 'video', 'question', 'check'].includes(d.add)) {
        const lastIntel = c.slides.map((x, i) => (SLIDE_TYPES[x.type]?.phase === 'intel' ? i : -1)).filter((i) => i >= 0).pop();
        if (lastIntel !== undefined) at = lastIntel + 1;
      }
      c.slides.splice(at, 0, s);
      sel = at; selSticker = -1;
      markDirty(); paintStrip(); paintEditor();
      toast(`${SLIDE_TYPES[d.add].label} slide added as slide ${at + 1}.`);
    }
  });
  // drag to reorder
  let dragFrom = null;
  $('#strip').addEventListener('dragstart', (e) => { const t = e.target.closest('.thumb'); if (t) { dragFrom = Number(t.dataset.i); e.dataTransfer.effectAllowed = 'move'; } });
  $('#strip').addEventListener('dragover', (e) => { if (dragFrom !== null) e.preventDefault(); });
  $('#strip').addEventListener('drop', (e) => {
    e.preventDefault();
    const t = e.target.closest('.thumb');
    if (t && dragFrom !== null && Number(t.dataset.i) !== dragFrom) move(dragFrom, Number(t.dataset.i));
    dragFrom = null;
  });

  // ----- slide editor -----
  const supportsImage = (t) => ['intel', 'picture', 'question', 'investigate', 'debrief'].includes(t);
  function paintEditor() {
    const s = c.slides[sel];
    const t = s.type;
    const field = (k, label, opts = {}) => (opts.area
      ? `<label>${label}<textarea data-k="${k}" rows="${opts.rows || 3}" maxlength="${opts.max || 1500}">${esc(s[k] || '')}</textarea>${opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</label>`
      : `<label>${label}<input data-k="${k}" maxlength="${opts.max || 200}" value="${esc(s[k] ?? '')}" ${opts.type ? `type="${opts.type}"` : ''} ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ''}>${opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</label>`);
    let f = '';
    if (t === 'title') f = field('heading', 'Title on the slide') + field('text', 'Red label', { ph: 'New case file opened' });
    if (t === 'hook') f = field('text', 'Set the scene', { area: true }) + field('heading', 'Big quote or mystery line') + field('question', 'Question on the yellow banner') + field('minutes', 'Timer (minutes, 0 for none)', { type: 'number' });
    if (t === 'intel') f = field('heading', 'Heading') + field('text', 'Text', { area: true, rows: 6, hint: 'Start lines with - for bullet points. 2 to 4 bullet points with no photo become pinned cards.' });
    if (t === 'picture') f = field('heading', 'Caption');
    if (t === 'video') f = field('heading', 'Title') + field('url', 'Video link', { ph: 'https://www.youtube.com/watch?v=…', hint: 'YouTube, Vimeo, Canva or Google Slides links play on the slide. Other links show an “Open” button.' });
    if (t === 'question') f = field('heading', 'Question') + field('text', 'Extra prompt (optional)', { area: true, rows: 2 });
    if (t === 'check') {
      f = field('heading', 'Question') + `<fieldset class="opts"><legend>Answers <span class="muted">· tick the right one</span></legend>
        ${(s.options || []).map((o, i) => `<div class="opt-row"><input type="radio" name="ans" value="${i}" ${Number(s.answer) === i ? 'checked' : ''} aria-label="Answer ${'ABCDEF'[i]} is correct">
          <b>${'ABCDEF'[i]}</b><input data-opt="${i}" maxlength="120" value="${esc(o)}">
          <button type="button" class="link-btn" data-optdel="${i}" aria-label="Remove answer ${'ABCDEF'[i]}">✕</button></div>`).join('')}
        ${(s.options || []).length < 5 ? '<button type="button" class="link-btn" id="opt-add">+ Add answer</button>' : ''}</fieldset>
        <p class="hint">On the projector, press Next to reveal the answer. On their devices, girls must get it right to unlock the investigation.</p>`;
    }
    if (t === 'timer') f = field('heading', 'Heading') + field('minutes', 'Minutes', { type: 'number' });
    if (t === 'investigate') f = field('heading', 'Heading') + field('text', 'Instructions for crews', { area: true, rows: 5, hint: 'Lines starting with - become numbered steps.' }) + field('minutes', 'Timer (minutes, 0 for none)', { type: 'number' });
    if (t === 'debrief') f = field('heading', 'Debrief question') + field('text', 'Line underneath', { ph: 'Spokespeople, report in.' }) + field('minutes', 'Minutes', { type: 'number' });
    if (t === 'lock') {
      f = field('heading', 'Lock name', { ph: 'The torn map' })
        + field('text', 'The clue', { area: true, rows: 4, hint: 'What crews must work out to find the code. Put the puzzle itself on cards in their envelope.' })
        + field('code', 'The code', { max: 40, ph: 'e.g. YOU ARE NOT LOST or 4271', hint: 'Spaces and capitals don’t matter. Students never see this: it’s stored separately, for teachers only.' })
        + field('hint', 'Hint (optional)', { ph: 'Shown if a crew asks for one' })
        + field('reward', 'What opens when they crack it', { area: true, rows: 3, hint: 'e.g. the next line of inquiry, a message, or where the next envelope is hidden.' });
    }
    if (t === 'twist') f = field('heading', 'Big headline', { ph: 'Plot twist' }) + field('text', 'What happens now', { area: true, rows: 3 }) + '<p class="hint">Twist cards only appear in Present mode, so they’re a surprise. Drop one in during a crew challenge.</p>';
    if (t === 'capture') f = field('heading', 'Heading') + '<p class="hint">This slide fills itself from “Capture and closing” below: the evidence ask and the first three case-notes questions.</p>';

    const img = s.image || {};
    const photo = supportsImage(t) ? `
      <div class="b-photo">
        <p class="b-sub">Photo <span class="muted">· optional</span></p>
        ${safeUrl(img.url) ? `<div class="photo-row"><img src="${esc(img.url)}" alt=""><span class="muted small">Current photo</span>
          <button type="button" class="link-btn" id="img-remove">Remove</button></div>` : ''}
        <input type="file" id="img-input" class="sr" accept="image/*">
        <div class="photo-btns">
          <label for="img-input" class="dropzone small" id="img-drop"><b>${safeUrl(img.url) ? 'Replace photo' : '+ Add photo'}</b><span class="muted small">Choose, take or drop one. You can also paste.</span></label>
          <button type="button" class="stamp-btn small ghost" id="lib-btn">My photo library</button>
        </div>
        <div id="library" hidden></div>
        ${safeUrl(img.url) && t !== 'picture' ? `<p class="b-sub">Photo layout</p>
          <div class="seg wide">${LAYOUTS.map(([k, l]) => `<button type="button" data-layout="${k}" class="${(img.layout || 'pin') === k ? 'on' : ''}">${l}</button>`).join('')}</div>
          ${(img.layout || 'pin') === 'pin' ? `<label>Photo label<input id="img-cap" maxlength="40" value="${esc(img.caption || '')}" placeholder="Exhibit A"></label>` : ''}` : ''}
      </div>` : '';

    const st = s.stickers?.[selSticker];
    const graphics = t === 'video' ? '' : `
      <div class="b-graphics">
        <p class="b-sub">Graphics <span class="muted">· tap to stick on the slide, then drag it in the preview</span></p>
        <div class="g-tabs" role="tablist">${GRAPHIC_GROUPS.map(([g]) => `<button type="button" role="tab" aria-selected="${g === gTab}" data-gtab="${esc(g)}" class="${g === gTab ? 'on' : ''}">${esc(g)}</button>`).join('')}</div>
        <div class="g-grid">${(GRAPHIC_GROUPS.find(([g]) => g === gTab) || GRAPHIC_GROUPS[0])[1].map((k) => `<button type="button" data-g="${k}" title="${esc(GRAPHICS[k].n)}" aria-label="Add ${esc(GRAPHICS[k].n)}">${graphicSvg(k)}</button>`).join('')}</div>
        ${st ? `<div class="sticker-tools"><b>Selected: ${esc(GRAPHICS[st.g]?.n || '')}</b>
          <label>Size<input type="range" min="3" max="60" value="${st.w}" id="st-size"></label>
          <label>Tilt<input type="range" min="-45" max="45" value="${st.r || 0}" id="st-rot"></label>
          <button type="button" class="link-btn" id="st-front">Bring to front</button>
          <button type="button" class="link-btn danger" id="st-del">Remove graphic</button></div>`
        : (s.stickers?.length ? '<p class="hint">Click a graphic on the preview to resize, tilt or remove it.</p>' : '')}
      </div>`;

    $('#editor').innerHTML = `
      <div class="b-ed-head"><p class="b-sec">Editing slide ${sel + 1} · ${esc(SLIDE_TYPES[t]?.label)}</p>
        <label class="inline small">Slide type <select id="s-type">${Object.entries(SLIDE_TYPES).map(([k, v]) => `<option value="${k}" ${k === t ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select></label></div>
      <div class="b-ed">
        <div class="b-fields">${f}${photo}${graphics}</div>
        <div class="b-preview"><p class="b-sub">Slide preview</p><div class="slide-frame big" id="preview"></div>
          <p class="hint">This is exactly what the projector shows.</p></div>
      </div>`;
    paintPreview();
    wireEditor();
  }

  function paintPreview() {
    const p = $('#preview');
    if (!p) return;
    const s = c.slides[sel];
    p.innerHTML = renderSlide(s, c, { mode: 'edit', tag: slideTags(c.slides)[sel], editing: true, reveal: s.type === 'check' });
    $$('.s-sticker', p).forEach((el) => el.classList.toggle('picked', Number(el.dataset.sticker) === selSticker));
    fitSlides($('#editor'));
  }
  const refreshSlide = () => { markDirty(); paintPreview(); paintStripOne(sel); };

  async function uploadSlideImage(file) {
    if (!file || !/^image\//.test(file.type || mimeFor(file))) return toast('That isn’t an image.', 'warn');
    const drop = $('#img-drop b');
    if (drop) drop.textContent = 'Uploading…';
    try {
      const f = await shrinkImage(file, 1920);
      if (f.size > MAX_BYTES) throw new Error('That image is too big (max 5 MB).');
      const ext = extOf(f.name).replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
      const path = `${me.id}/${uid()}.${ext}`;
      const { error } = await sb.storage.from('slides').upload(path, f, { contentType: f.type, cacheControl: '31536000' });
      if (error) throw error;
      const { data } = sb.storage.from('slides').getPublicUrl(path);
      const s = c.slides[sel];
      s.image = { ...(s.image || {}), url: data.publicUrl, layout: s.image?.layout || (s.type === 'picture' ? 'pin' : 'pin') };
      markDirty(); paintEditor(); paintStripOne(sel);
      toast('Photo added');
    } catch (err) {
      toast(friendlyError(err), 'warn');
      if (drop) drop.textContent = '+ Add photo';
    }
  }

  async function showLibrary() {
    const box = $('#library');
    if (!box.hidden) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = '<p class="muted small">Loading your photos…</p>';
    try {
      const { data: folders, error } = await sb.storage.from('slides').list('', { limit: 100 });
      if (error) throw error;
      const files = [];
      for (const fo of folders || []) {
        if (fo.id) continue; // a file at the root, skip
        const { data } = await sb.storage.from('slides').list(fo.name, { limit: 200, sortBy: { column: 'created_at', order: 'desc' } });
        (data || []).forEach((x) => { if (x.id) files.push(`${fo.name}/${x.name}`); });
      }
      box.innerHTML = files.length
        ? `<div class="lib-grid">${files.map((p) => { const u = sb.storage.from('slides').getPublicUrl(p).data.publicUrl; return `<button type="button" data-lib="${esc(u)}"><img src="${esc(u)}" alt="" loading="lazy"></button>`; }).join('')}</div>`
        : '<p class="muted small">No photos yet. Photos you and other teachers add appear here for any case.</p>';
    } catch (err) { box.innerHTML = `<p class="error">${esc(friendlyError(err))}</p>`; }
  }

  function wireEditor() {
    const s = c.slides[sel];
    $$('#editor [data-k]').forEach((el) => el.addEventListener('input', () => {
      const k = el.dataset.k;
      s[k] = k === 'minutes' ? Math.max(0, Math.min(120, Number(el.value) || 0)) : el.value;
      if (k === 'code') s.codeLen = normCode(el.value).length;
      refreshSlide();
    }));
    $('#s-type').addEventListener('change', (e) => {
      const fresh = newSlide(e.target.value, c);
      const keep = { id: s.id, heading: s.heading || fresh.heading, text: s.text || fresh.text, image: s.image, stickers: s.stickers || [] };
      c.slides[sel] = { ...fresh, ...keep };
      markDirty(); paintStrip(); paintEditor();
    });
    $$('#editor [data-opt]').forEach((el) => el.addEventListener('input', () => { s.options[Number(el.dataset.opt)] = el.value; refreshSlide(); }));
    $$('#editor input[name="ans"]').forEach((el) => el.addEventListener('change', () => { s.answer = Number(el.value); refreshSlide(); }));
    $$('#editor [data-optdel]').forEach((b) => b.addEventListener('click', () => {
      if (s.options.length <= 2) return toast('A check needs at least two answers.', 'warn');
      const i = Number(b.dataset.optdel);
      s.options.splice(i, 1);
      if (Number(s.answer) === i) s.answer = 0; else if (Number(s.answer) > i) s.answer -= 1;
      markDirty(); paintEditor(); paintStripOne(sel);
    }));
    $('#opt-add')?.addEventListener('click', () => { s.options.push(''); markDirty(); paintEditor(); });
    // photos
    $('#img-input')?.addEventListener('change', (e) => { uploadSlideImage(e.target.files[0]); e.target.value = ''; });
    const drop = $('#img-drop');
    if (drop) {
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); uploadSlideImage(e.dataTransfer.files[0]); });
    }
    $('#img-remove')?.addEventListener('click', () => { delete s.image; markDirty(); paintEditor(); paintStripOne(sel); });
    $('#lib-btn')?.addEventListener('click', showLibrary);
    $('#library')?.addEventListener('click', (e) => {
      const b = e.target.closest('[data-lib]');
      if (!b) return;
      s.image = { ...(s.image || {}), url: b.dataset.lib, layout: s.image?.layout || 'pin' };
      markDirty(); paintEditor(); paintStripOne(sel);
    });
    $$('#editor [data-layout]').forEach((b) => b.addEventListener('click', () => { s.image.layout = b.dataset.layout; markDirty(); paintEditor(); paintStripOne(sel); }));
    $('#img-cap')?.addEventListener('input', (e) => { s.image.caption = e.target.value; refreshSlide(); });
    // graphics
    $$('#editor [data-gtab]').forEach((b) => b.addEventListener('click', () => { gTab = b.dataset.gtab; paintEditor(); }));
    $$('#editor [data-g]').forEach((b) => b.addEventListener('click', () => {
      s.stickers = s.stickers || [];
      const n = s.stickers.length;
      s.stickers.push({ g: b.dataset.g, x: 78 - (n % 4) * 6, y: 24 + (n % 4) * 8, w: /tape|stamp|closed|secret|classified|evidence|confidential|urgent|reopened/.test(b.dataset.g) ? 22 : 12, r: 0 });
      selSticker = s.stickers.length - 1;
      markDirty(); paintEditor(); paintStripOne(sel);
    }));
    const stx = s.stickers?.[selSticker];
    if (stx) {
      $('#st-size').addEventListener('input', (e) => { stx.w = Number(e.target.value); refreshSlide(); });
      $('#st-rot').addEventListener('input', (e) => { stx.r = Number(e.target.value); refreshSlide(); });
      $('#st-del').addEventListener('click', () => { s.stickers.splice(selSticker, 1); selSticker = -1; markDirty(); paintEditor(); paintStripOne(sel); });
      $('#st-front').addEventListener('click', () => { s.stickers.push(...s.stickers.splice(selSticker, 1)); selSticker = s.stickers.length - 1; markDirty(); paintEditor(); paintStripOne(sel); });
    }
    // drag graphics on the preview
    const prev = $('#preview');
    prev.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('.s-sticker');
      if (!el) { if (selSticker !== -1) { selSticker = -1; paintEditor(); } return; }
      e.preventDefault();
      const i = Number(el.dataset.sticker);
      if (i !== selSticker) { selSticker = i; paintEditor(); }
      const frame = $('#preview');
      const node = $(`.s-sticker[data-sticker="${i}"]`, frame);
      const r = frame.getBoundingClientRect();
      const stk = c.slides[sel].stickers[i];
      const onMove = (ev) => {
        stk.x = Math.max(0, Math.min(100, ((ev.clientX - r.left) / r.width) * 100));
        stk.y = Math.max(0, Math.min(100, ((ev.clientY - r.top) / r.height) * 100));
        node.style.left = `${stk.x}%`;
        node.style.top = `${stk.y}%`;
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        markDirty(); paintStripOne(sel);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  // paste a photo anywhere in the builder
  document.onpaste = (e) => {
    if (!$('#editor') || !supportsImage(c.slides[sel].type)) return;
    const item = [...(e.clipboardData?.items || [])].find((x) => x.type.startsWith('image/'));
    if (item) { e.preventDefault(); uploadSlideImage(item.getAsFile()); }
  };

  // ----- save -----
  async function save() {
    if (!c.title.trim()) return toast('Give the case a title.', 'warn');
    const noCode = c.slides.find((s) => s.type === 'lock' && !normCode(s.code));
    if (noCode) { sel = c.slides.indexOf(noCode); paintStrip(); paintEditor(); return toast('This padlock needs a code before you save.', 'warn'); }
    for (const s of c.slides) {
      if (s.type !== 'lock') continue;
      s.codeLen = normCode(s.code).length;
      s.codeHash = await codeHash(s.id, s.code);
    }
    const publicSlides = c.slides.map(({ code, ...rest }) => rest);
    const row = {
      title: c.title.trim().slice(0, 80), brief: c.brief || '', element: (c.element || '').trim() || null, xp: c.xp,
      prompts: c.prompts?.length ? c.prompts : DEFAULT_PROMPTS, steps: c.steps || [], week: c.week || null, boss: !!c.boss,
      note: c.note || null, district: c.district || 1, location: (c.location || '').trim() || null, message: (c.message || '').trim() || null,
      slides: publicSlides, closed_msg: (c.closed_msg || '').trim() || null, reopen_msg: (c.reopen_msg || '').trim() || null,
      capture_ask: (c.capture_ask || '').trim() || null, active: !!c.active,
      intentions: c.intentions || [], files: c.files || [],
    };
    $$('#save, #save2').forEach((b) => { b.disabled = true; b.textContent = 'Saving…'; });
    const res = c.id
      ? await sb.from('challenges').update(row).eq('id', c.id).select('id').single()
      : await sb.from('challenges').insert(row).select('id').single();
    $$('#save, #save2').forEach((b) => { b.disabled = false; });
    $('#save').textContent = 'Save';
    $('#save2').textContent = 'Save case';
    if (res.error) return toast(friendlyError(res.error), 'warn');
    const cid = c.id || res.data.id;
    const locks = c.slides.filter((s) => s.type === 'lock');
    if (locks.length) {
      const { error: ce } = await sb.from('lock_codes').upsert(locks.map((s) => ({ challenge_id: cid, slide_id: s.id, code: normCode(s.code), updated_at: new Date().toISOString() })));
      if (ce) return toast(`Saved, but the padlock codes didn’t save: ${friendlyError(ce)}`, 'warn');
    }
    const { data: oldCodes } = await sb.from('lock_codes').select('slide_id').eq('challenge_id', cid);
    const gone = (oldCodes || []).map((r) => r.slide_id).filter((sid) => !locks.some((s) => s.id === sid));
    if (gone.length) await sb.from('lock_codes').delete().eq('challenge_id', cid).in('slide_id', gone);
    dirty = false;
    leaveGuard = null;
    toast('Case saved');
    if (!c.id) { c.id = res.data.id; lastHash = `#/edit/${c.id}`; location.hash = `#/edit/${c.id}`; return; }
    const b = $('#save-state');
    b.textContent = 'All changes saved';
    b.className = 'chip';
  }
  $('#save').addEventListener('click', save);
  $('#save2').addEventListener('click', save);
  $('#go-present')?.addEventListener('click', (e) => {
    if (dirty) { e.preventDefault(); toast('Save first, then present.', 'warn'); }
  });
  document.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && $('#editor')) { e.preventDefault(); save(); }
  };

  paintStrip();
  paintEditor();
  if (dirty) leaveGuard = true;
}

// ---------- Present mode ----------------------------------------------------
async function presentMode(id, start) {
  try {
    const { data: c, error } = await sb.from('challenges').select('*').eq('id', id).maybeSingle();
    if (error) throw error;
    if (!c) { location.hash = '#/cases'; return; }
    const slides = slidesFor(c);
    const tags = slideTags(slides);
    const codes = {};
    if (slides.some((s) => s.type === 'lock')) {
      const { data: cr } = await sb.from('lock_codes').select('slide_id, code').eq('challenge_id', c.id);
      (cr || []).forEach((r) => { codes[r.slide_id] = r.code; });
    }
    let i = Math.max(0, Math.min(slides.length - 1, Number(start) || 0));
    let reveal = false;
    const timers = {};
    let tick = null;
    let idle = null;

    document.body.classList.add('presenting');
    app.innerHTML = `
      <div class="present" id="present">
        <div class="present-stage"><div class="slide-frame present-frame" id="pframe"></div></div>
        <div class="crew-overlay" id="crew-overlay" hidden></div>
        <div class="present-bar" id="pbar">
          <button type="button" id="p-exit" aria-label="Exit">✕ Exit</button>
          <button type="button" id="p-prev" aria-label="Previous slide">◀</button>
          <span id="p-count"></span>
          <button type="button" id="p-next" class="red" aria-label="Next slide">Next ▶</button>
          <span class="p-timer" id="p-timer"></span>
          <button type="button" id="p-full">Full screen (F)</button>
          <button type="button" id="p-board">Crew board (S)</button>
          <span class="p-help">← → or clicker to move · T timer · R reset · S crew board</span>
        </div>
      </div>`;

    const timerFor = (k) => {
      const s = slides[k];
      const mins = Number(s.minutes ?? SLIDE_TYPES[s.type]?.minutes ?? 0);
      if (!mins || !['hook', 'timer', 'investigate'].includes(s.type)) return null;
      timers[k] ||= { left: mins * 60, total: mins * 60, running: false };
      return timers[k];
    };
    function paintTimer() {
      const t = timerFor(i);
      const el = $('[data-timer]', $('#pframe'));
      if (el && t) { el.textContent = fmtClock(t.left); el.classList.toggle('done', t.left === 0); el.classList.toggle('running', t.running); }
      $('#p-timer').innerHTML = t
        ? `<button type="button" id="p-tgo">${t.running ? 'Pause' : t.left === t.total ? 'Start timer' : 'Resume'} (T)</button><button type="button" id="p-treset">Reset (R)</button>`
        : '';
      $('#p-tgo')?.addEventListener('click', toggleTimer);
      $('#p-treset')?.addEventListener('click', resetTimer);
    }
    function toggleTimer() {
      const t = timerFor(i);
      if (!t) return;
      t.running = !t.running && t.left > 0;
      clearInterval(tick);
      if (t.running) {
        tick = setInterval(() => {
          t.left = Math.max(0, t.left - 1);
          if (t.left === 0) { t.running = false; clearInterval(tick); }
          paintTimer();
        }, 1000);
      }
      paintTimer();
    }
    function resetTimer() { const t = timerFor(i); if (!t) return; t.left = t.total; t.running = false; clearInterval(tick); paintTimer(); }
    function paint() {
      const t = timerFor(i);
      $('#pframe').innerHTML = renderSlide(slides[i], c, { mode: 'present', tag: tags[i], reveal, open: slides[i].type === 'lock' && reveal, code: codes[slides[i].id], timerSecs: t ? t.left : undefined });
      $('#p-count').textContent = `${i + 1} / ${slides.length} · ${SLIDE_TYPES[slides[i].type]?.label || ''}`;
      fitSlides($('#present'));
      paintTimer();
    }
    function go(dir) {
      if (dir > 0 && ['check', 'lock'].includes(slides[i].type) && !reveal) { reveal = true; paint(); return; }
      const n = Math.max(0, Math.min(slides.length - 1, i + dir));
      if (n === i) return;
      const t = timerFor(i);
      if (t?.running) { /* keep counting in the background */ }
      i = n;
      reveal = false;
      clearInterval(tick);
      const nt = timerFor(i);
      if (nt?.running) { nt.running = false; toggleTimer(); }
      paint();
    }
    // live crew board overlay
    let boardTimer = null;
    let boardGroups = null;
    const paintBoard = async () => {
      const ov = $('#crew-overlay');
      if (!ov || ov.hidden) return;
      if (!boardGroups) boardGroups = groupsOf(await loadStudents());
      let g = store('l2l-t-group') || '';
      if (!boardGroups.includes(g)) g = boardGroups[0] || '';
      const inner = await crewBoardHtml(c, slides, g);
      if (ov.hidden) return;
      ov.innerHTML = `${inner}<div class="board-bar">
        <label>Group <select id="board-group">${boardGroups.map((x) => `<option ${x === g ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        <button type="button" id="board-reset">Reset board</button>
        <button type="button" id="board-close">Back to slides (S)</button><span class="muted">Updates every few seconds</span></div>`;
      $('#board-group').addEventListener('change', (e) => { store('l2l-t-group', e.target.value); paintBoard(); });
      $('#board-close').addEventListener('click', toggleBoard);
      $('#board-reset').addEventListener('click', async () => {
        if (!confirm('Clear every crew’s cracked locks for this case?')) return;
        await sb.from('crew_progress').delete().eq('challenge_id', c.id);
        paintBoard();
      });
    };
    function toggleBoard() {
      const ov = $('#crew-overlay');
      ov.hidden = !ov.hidden;
      clearInterval(boardTimer);
      if (!ov.hidden) {
        if (!slides.some((s) => s.type === 'lock')) toast('This case has no padlocks yet, so the board will stay empty.', 'warn');
        ov.innerHTML = '<div class="board"><p class="board-sub">Loading crews…</p></div>';
        paintBoard();
        boardTimer = setInterval(paintBoard, 4000);
      }
    }
    $('#p-board').addEventListener('click', toggleBoard);
    const exit = () => {
      clearInterval(tick);
      clearInterval(boardTimer);
      document.onkeydown = null;
      if (document.fullscreenElement) document.exitFullscreen?.();
      document.body.classList.remove('presenting');
      location.hash = `#/edit/${c.id}`;
    };
    const full = () => (document.fullscreenElement ? document.exitFullscreen?.() : $('#present').requestFullscreen?.());
    $('#p-prev').addEventListener('click', () => go(-1));
    $('#p-next').addEventListener('click', () => go(1));
    $('#p-exit').addEventListener('click', exit);
    $('#p-full').addEventListener('click', full);
    $('#pframe').addEventListener('click', (e) => { if (!e.target.closest('a, iframe, button')) go(1); });
    document.onkeydown = (e) => {
      if (!document.body.classList.contains('presenting')) return;
      const k = e.key;
      if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); go(1); }
      else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); go(-1); }
      else if (k.toLowerCase() === 'f') full();
      else if (k.toLowerCase() === 't') toggleTimer();
      else if (k.toLowerCase() === 'r') resetTimer();
      else if (k.toLowerCase() === 's') toggleBoard();
      else if (k === 'Escape' && !document.fullscreenElement) exit();
    };
    const wake = () => {
      $('#pbar')?.classList.remove('sleep');
      clearTimeout(idle);
      idle = setTimeout(() => $('#pbar')?.classList.add('sleep'), 3000);
    };
    $('#present').addEventListener('mousemove', wake);
    wake();
    paint();
  } catch (e) { errorPage('cases', e); }
}

// ---------- Class -----------------------------------------------------------
async function teacherClass() {
  loadingPage('class');
  try {
    const filter = store('l2l-t-group') || '';
    const [students, subs, waiting] = await Promise.all([
      loadStudents(), fetchAll(() => sb.from('submissions').select('student_id, status')), waitingCount(),
    ]);
    const stats = {};
    subs.forEach((s) => {
      const t = (stats[s.student_id] ||= { total: 0, waiting: 0, closed: 0 });
      t.total++;
      if (s.status === 'submitted') t.waiting++;
      if (s.status === 'approved') t.closed++;
    });
    const groups = groupsOf(students);
    const list = students.filter((s) => !filter || s.mentor_group === filter);
    const avgLevel = list.length ? (list.reduce((a, s) => a + levelOf(s.xp), 0) / list.length).toFixed(1) : '–';
    shell('class', `
      <section class="page-head">
        <div><h1 class="label-black">CLASS</h1><p>Every detective’s progress at a glance.</p></div>
        <div class="controls">${groupSelect(groups, filter)}</div>
      </section>
      <div class="stats">
        <div class="stat"><b>${list.length}</b><span>Detectives</span></div>
        <div class="stat"><b>${list.filter((s) => stats[s.id]?.total).length}</b><span>Have filed a case</span></div>
        <div class="stat"><b>${avgLevel}</b><span>Average level</span></div>
        <div class="stat"><b>${list.reduce((a, s) => a + (stats[s.id]?.waiting || 0), 0)}</b><span>Waiting for review</span></div>
      </div>
      <section class="paper">
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Username</th><th>Group</th><th>Rank</th><th>XP</th><th>Cases</th><th><span class="sr">Actions</span></th></tr></thead>
          <tbody>${list.map((s) => `<tr>
            <td><a href="#/portfolio/${s.id}"><b>${esc(s.display_name)}</b></a></td><td><code>${esc(s.username)}</code></td><td>${esc(s.mentor_group || '–')}</td>
            <td>${esc(rankOf(s.xp))} · L${levelOf(s.xp)}</td><td>${s.xp}</td>
            <td>${stats[s.id]?.closed || 0} closed${stats[s.id]?.waiting ? ` <span class="chip warn">${stats[s.id].waiting} waiting</span>` : ''}</td>
            <td><a class="stamp-btn small ghost" href="#/portfolio/${s.id}">View portfolio</a> <button class="stamp-btn small ghost" data-viewas="${s.id}">Student view</button> <button class="link-btn" data-reset="${s.id}" data-name="${esc(s.display_name)}">New password</button></td>
          </tr>`).join('') || '<tr><td colspan="7" class="center muted">No students yet. Add some below.</td></tr>'}</tbody>
        </table></div>
      </section>
      <form class="paper" id="add-form">
        <h2>Add detectives</h2>
        <p class="muted">One student per line. First name only, or first name plus surname initial (e.g. “Amelia K”). No other personal details.</p>
        <label for="names">Names</label>
        <textarea id="names" rows="6" placeholder="Amelia K&#10;Zara&#10;Priya S"></textarea>
        <label for="new-group">Mentor group</label>
        <input id="new-group" list="groups" maxlength="30" value="${esc(filter)}" placeholder="e.g. 7B Buiks">
        <datalist id="groups">${groups.map((g) => `<option value="${esc(g)}">`).join('')}</datalist>
        <button class="stamp-btn" type="submit">Create logins</button>
      </form>
      <div id="cards-out"></div>`, { waiting });
    $('#group-filter').addEventListener('change', (e) => { store('l2l-t-group', e.target.value); teacherClass(); });
    $('#add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const names = $('#names').value.split('\n').map((n) => n.trim()).filter(Boolean);
      if (!names.length) return toast('Add at least one name.', 'warn');
      const btn = $('#add-form button');
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const res = await callFunction({ action: 'create_students', names, mentor_group: $('#new-group').value.trim() });
        showLoginCards(res, 'New logins');
        $('#names').value = '';
      } catch (err) { toast(friendlyError(err), 'warn'); }
      btn.disabled = false; btn.textContent = 'Create logins';
    });
    $$('[data-reset]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm(`Make a new password for ${b.dataset.name}? Her old password will stop working.`)) return;
      b.disabled = true;
      try { showLoginCards(await callFunction({ action: 'reset_password', student_id: b.dataset.reset }), 'New password'); } catch (err) { toast(friendlyError(err), 'warn'); }
      b.disabled = false;
    }));
  } catch (e) { errorPage('class', e); }
}

function showLoginCards(res, heading) {
  const site = location.origin + location.pathname;
  const out = $('#cards-out');
  out.innerHTML = `
    <section class="paper print-area">
      <div class="row-actions no-print"><h2>${esc(heading)}</h2><button class="stamp-btn" id="print-cards">Print login cards</button></div>
      <p class="muted no-print">Print these now. Passwords are only shown once. If one gets lost, use “New password”.</p>
      ${res.failed?.length ? `<p class="error no-print">Couldn’t create: ${res.failed.map((f) => `${esc(f.name)} (${esc(f.reason)})`).join(', ')}</p>` : ''}
      <div class="login-cards">
        ${res.created.map((x) => `<div class="login-card">
          <p class="lc-brand">THRIVE CITY · DETECTIVE BADGE</p>
          <p class="lc-name">${esc(x.name)}${x.mentor_group ? ` · ${esc(x.mentor_group)}` : ''}</p>
          <p><span>Website</span><b>${esc(site)}</b></p>
          <p><span>Detective name</span><b>${esc(x.username)}</b></p>
          <p><span>Secret code</span><b>${esc(x.password)}</b></p>
          <p class="lc-note">Keep this card private. Don’t share your code.</p>
        </div>`).join('')}
      </div>
    </section>`;
  $('#print-cards').addEventListener('click', () => window.print());
  out.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
  toast(`${res.created.length} login${res.created.length === 1 ? '' : 's'} ready`);
}

// ---------- Teachers (admin only) --------------------------------------------
async function teacherTeachers() {
  if (!me.is_admin) { location.hash = '#/review'; return; }
  loadingPage('teachers');
  try {
    const teachers = await fetchAll(() => sb.from('profiles').select('*').eq('role', 'teacher').order('display_name'));
    shell('teachers', `
      <section class="page-head"><div><h1 class="label-black">TEACHERS</h1><p>Mentor teachers can see every student, review case files and build cases.</p></div></section>
      <div class="two-col">
        <form class="paper" id="t-form">
          <h2>Add a teacher</h2>
          <label for="t-name">Name students see</label><input id="t-name" maxlength="40" required placeholder="Mrs Smith">
          <label for="t-email">School email</label><input id="t-email" type="email" required placeholder="name@school.edu.au">
          <button class="stamp-btn" type="submit">Create teacher login</button>
          <div id="t-out"></div>
        </form>
        <div class="list">${teachers.map((t) => `<article class="paper mini"><h3>${esc(t.display_name)} ${t.is_admin ? '<span class="chip green">Admin</span>' : ''}</h3><p class="muted">${esc(t.username)}</p></article>`).join('')}</div>
      </div>`);
    $('#t-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#t-form button');
      btn.disabled = true;
      try {
        const res = await callFunction({ action: 'create_teacher', name: $('#t-name').value.trim(), email: $('#t-email').value.trim() });
        $('#t-out').innerHTML = `<div class="memo"><p><b>${esc(res.name)}</b> can now log in.</p><p>Email: <code>${esc(res.email)}</code><br>Password: <code>${esc(res.password)}</code></p><p class="muted">Send these privately. This password won’t be shown again.</p></div>`;
        $('#t-name').value = ''; $('#t-email').value = '';
      } catch (err) { toast(friendlyError(err), 'warn'); }
      btn.disabled = false;
    });
  } catch (e) { errorPage('teachers', e); }
}

  if (event === 'SIGNED_OUT' && me) { me = null; renderLogin(); }
});
boot().catch((e) => {
  app.innerHTML = `<section class="paper narrow center"><h2>Couldn’t start</h2><p>${esc(friendlyError(e))}</p></section>`;
});
