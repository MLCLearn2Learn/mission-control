<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thrive City Case Files · MLC Learn to Thrive</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>/* =====================================================================
   THRIVE CITY CASE FILES · kraft paper, typewriter, red pins
   ===================================================================== */
:root {
  --kraft: #C8A473; --kraft-dark: #A9844F; --paper: #F4EFE6; --paper-2: #FBFAF6;
  --ink: #1A1A1A; --muted: #5A5148; --red: #B3170F; --red-dark: #7A0D07; --red-bright: #FF5A4E;
  --memo: #FFF6C9; --rule: #C9C1B3; --ok: #2F6B3A; --yellow: #F2C200;
  --type: 'Special Elite', 'Courier New', monospace;
  --body: 'Courier Prime', 'Courier New', monospace;
  --shadow: 0 8px 18px rgba(60, 35, 10, 0.28);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  background-color: var(--kraft);
  background-image: radial-gradient(ellipse at 15% 15%, rgba(255, 240, 210, 0.45), transparent 45%), radial-gradient(ellipse at 85% 80%, rgba(120, 80, 40, 0.25), transparent 50%);
  background-attachment: fixed;
}
h1, h2, h3, h4 { font-family: var(--type); font-weight: 400; line-height: 1.1; margin: 0 0 0.4em; }
h1 { font-size: clamp(30px, 5vw, 50px); }
h2 { font-size: 26px; }
h3 { font-size: 21px; }
p { margin: 0 0 0.8em; }
a { color: var(--red); }
a:hover { color: var(--ink); }
code { background: rgba(26, 26, 26, 0.08); padding: 2px 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hint { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 400; }
.error { color: var(--red); font-weight: 700; }
.ok-text { color: var(--ok); }
.bad-text { color: var(--red); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* ---------- Paper pieces ---------- */
.paper { background: var(--paper); padding: 24px 26px; box-shadow: var(--shadow); position: relative; margin-bottom: 22px; }
.paper.mini { padding: 16px 18px; }
.pinned::before, .pin {
  content: ''; position: absolute; top: -12px; left: 50%; margin-left: -12px; width: 24px; height: 24px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FF6B5E, var(--red) 60%, var(--red-dark)); box-shadow: 1px 3px 4px rgba(0, 0, 0, 0.3); z-index: 2;
}
.memo { background: var(--memo); padding: 16px 20px; box-shadow: 2px 6px 12px rgba(60, 35, 10, 0.25); margin-bottom: 18px; }
.memo.taped { border-top: 20px solid rgba(26, 26, 26, 0.85); transform: rotate(-1deg); }
.memo.slim { padding: 10px 16px; font-weight: 700; }
.eyebrow { margin: 0 0 4px; font-weight: 700; letter-spacing: 0.18em; font-size: 13px; color: var(--red); text-transform: uppercase; }
.eyebrow.ink { color: var(--ink); }
.label-black { display: inline-block; background: var(--ink); color: var(--paper); font-family: var(--type); padding: 8px 18px 5px; font-size: clamp(22px, 3.4vw, 36px); transform: rotate(-1deg); margin: 0 0 8px; }
.label-black.small { font-size: 16px; padding: 6px 12px 4px; transform: none; }
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 9px; border: 2px solid var(--ink); background: var(--paper-2); white-space: nowrap; }
.chip.green { border-color: var(--ok); color: var(--ok); }
.chip.warn { background: var(--memo); }
.chip.black { background: var(--ink); color: var(--yellow); }
.chip.red { background: var(--red); color: #fff; border-color: var(--red); }
.xp-chip { font-family: var(--type); color: var(--red); border: 3px solid var(--red); padding: 2px 10px 0; transform: rotate(-4deg); }

/* stamps */
.stamp-mark {
  position: absolute; top: 18px; right: 22px; font-family: var(--type); font-size: 20px; padding: 4px 12px 1px; border: 4px solid currentColor;
  transform: rotate(-6deg); color: var(--ink); background: rgba(244, 239, 230, 0.6); letter-spacing: 0.04em;
}
.stamp-mark.closed { color: var(--ok); }
.stamp-mark.reopened, .stamp-mark.current { color: var(--red); }
.stamp-mark.open { color: var(--red); }
.stamp-mark.filed { color: var(--ink); transform: rotate(4deg); }

/* buttons */
.stamp-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 22px 6px;
  font-family: var(--type); font-size: 20px; color: #fff; background: var(--red); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  cursor: pointer; text-decoration: none; transition: transform 0.1s, box-shadow 0.1s;
}
.stamp-btn:hover { color: #fff; transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.stamp-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.stamp-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.stamp-btn.big { font-size: 24px; min-height: 58px; padding: 10px 28px 8px; }
.stamp-btn.small { font-size: 16px; min-height: 40px; padding: 4px 14px 2px; box-shadow: 3px 3px 0 var(--ink); }
.stamp-btn.ghost { background: var(--paper-2); color: var(--ink); }
.stamp-btn.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: 3px 3px 0 var(--red); }
.stamp-btn.green { background: var(--ok); }
.link-btn { background: none; border: 0; padding: 6px 4px; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; color: var(--ink); min-height: 40px; }
.link-btn.danger { color: var(--red); }
.row-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 16px; }

/* forms */
label { display: block; font-weight: 700; margin: 14px 0 6px; }
label.inline { display: inline-flex; gap: 8px; align-items: center; margin: 0; }
label.check { display: flex; gap: 10px; align-items: center; font-weight: 700; }
input, textarea, select { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 2px solid var(--ink); background: var(--paper-2); color: var(--ink); border-radius: 0; }
input[type=checkbox], input[type=radio] { width: 22px; height: 22px; accent-color: var(--red); flex: none; }
input[type=range] { padding: 0; border: 0; background: none; accent-color: var(--red); }
label.inline select { width: auto; }
textarea { resize: vertical; }
textarea.lined { background: repeating-linear-gradient(var(--paper-2) 0 31px, #C9D6E3 31px 32px); line-height: 32px; padding-top: 4px; }
.seg { display: inline-flex; border: 2px solid var(--ink); }
.seg button { font: inherit; font-weight: 700; padding: 8px 14px; border: 0; background: var(--paper-2); cursor: pointer; min-height: 44px; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg.wide { display: flex; flex-wrap: wrap; }
.seg.wide button { flex: 1 1 auto; }

/* ---------- Header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 28px; max-width: 1240px; margin: 0 auto; }
.top.wide { max-width: 1500px; }
.brand-tag { font-family: var(--type); font-size: 20px; background: var(--ink); color: var(--paper); padding: 7px 14px 5px; text-decoration: none; }
.brand-tag:hover { color: var(--yellow); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs a { font-weight: 700; text-decoration: none; color: var(--ink); padding: 8px 12px; border-bottom: 4px solid transparent; }
.tabs a.on { border-bottom-color: var(--red); }
.tabs .count { background: var(--red); color: #fff; padding: 0 7px; margin-left: 4px; font-size: 13px; }
.hud { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.hud-rank { background: var(--paper); padding: 6px 12px; font-weight: 700; }
.hud-xp { font-family: var(--type); color: var(--red); border: 3px solid var(--red); padding: 2px 10px 0; transform: rotate(-4deg); }
.hud-bar { display: inline-block; width: 90px; height: 10px; background: rgba(26, 26, 26, 0.25); }
.hud-bar.big { width: 100%; height: 12px; background: #4A4A4A; }
.hud-bar i { display: block; height: 100%; background: var(--red); }
.who { display: flex; gap: 10px; align-items: center; }
.top:not(:has(.hud)) .who { margin-left: auto; }
.page { max-width: 1240px; margin: 0 auto; padding: 10px 28px 70px; }
.page.wide { max-width: 1500px; }
.page-head { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; margin: 10px 0 22px; }
.page-head p { margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.back { font-weight: 700; color: var(--ink); }
.loading { display: flex; justify-content: center; padding: 80px 0; }
.spinner { width: 44px; height: 44px; border: 5px solid rgba(26, 26, 26, 0.2); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 60px 16px; }
.tape-band { position: absolute; left: -5%; width: 110%; height: 44px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 40px, var(--ink) 40px 80px); }
.tape-band.one { top: 7%; transform: rotate(-4deg); }
.tape-band.two { bottom: 7%; transform: rotate(3deg); }
.folder { position: relative; width: min(600px, 100%); transform: rotate(-1.2deg); z-index: 1; }
.folder-tab { position: absolute; top: -32px; left: 30px; width: 200px; height: 38px; background: #B08A55; border-radius: 6px 6px 0 0; }
.folder-paper { background: var(--paper); padding: 34px 40px 28px; position: relative; box-shadow: 0 0 0 20px #B08A55, 0 24px 40px 20px rgba(60, 35, 10, 0.35); }
.login-stamp { top: 22px; right: 22px; color: var(--red); transform: rotate(8deg); }
.login-title { font-size: clamp(38px, 8vw, 56px); line-height: 1; margin: 6px 0; }
.login-sub { font-size: 18px; }
.folder-paper input { font-size: 20px; border-width: 3px; }
.folder-paper .stamp-btn { margin: 20px 0 14px; }

/* ---------- City map ---------- */
.map-head { margin: 6px 0 10px; }
.map-q { font-weight: 700; letter-spacing: 0.06em; margin: 0; }
.districts { display: flex; flex-wrap: wrap; border: 3px solid var(--ink); background: var(--paper); margin-bottom: 22px; }
.districts > * { flex: 1 1 160px; padding: 8px 12px; border-right: 2px solid var(--ink); text-decoration: none; color: var(--ink); font-size: 13px; line-height: 1.3; }
.districts b { display: block; font-family: var(--type); font-weight: 400; font-size: 16px; }
.districts a.on { background: var(--dc); color: #fff; }
.districts .locked { color: var(--muted); }
.districts .finale { background: var(--ink); color: var(--yellow); border-right: 0; }
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 30px; align-items: start; }
.city {
  position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 46px 30px; padding: 40px 30px 40px;
  background: #E9DCC3; box-shadow: inset 0 0 0 3px var(--ink), 0 14px 30px rgba(60, 35, 10, 0.35);
  background-image: linear-gradient(90deg, transparent 31%, rgba(211, 195, 163, 0.8) 31% 34%, transparent 34% 65%, rgba(211, 195, 163, 0.8) 65% 68%, transparent 68%),
    linear-gradient(0deg, transparent 47%, rgba(211, 195, 163, 0.8) 47% 51%, transparent 51%);
}
.city .string { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.loc { position: relative; z-index: 1; display: block; background: var(--paper); padding: 16px 16px 14px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); transform: rotate(var(--t, 0deg)); transition: transform 0.15s; }
.loc:hover { transform: rotate(0deg) scale(1.03); color: var(--ink); }
.loc .pin { top: -12px; }
.loc h3 { margin: 4px 0 8px; font-size: 20px; }
.loc-no { margin: 0; font-weight: 700; letter-spacing: 0.14em; font-size: 12px; }
.loc-no.gold { color: var(--yellow); }
.loc-st { display: inline-block; font-family: var(--type); font-size: 14px; padding: 2px 8px 0; border: 2px solid currentColor; }
.loc-msg { margin: 10px 0 0; font-size: 14px; line-height: 1.4; }
.loc.closed .loc-st { color: var(--ok); }
.loc.filed .loc-st { color: var(--ink); }
.loc.reopened .loc-st, .loc.open .loc-st { color: var(--red); }
.loc.current { outline: 4px solid var(--red); outline-offset: -8px; }
.loc.current .loc-st { background: var(--red); color: #fff; border-color: var(--red); }
.loc.boss { background: var(--ink); color: var(--paper); }
.loc.boss h3 { font-size: 24px; }
.loc.boss .loc-st { color: var(--yellow); }
.loc.classified { background: repeating-linear-gradient(-45deg, #3A332C 0 10px, #2A241F 10px 20px); color: var(--kraft); pointer-events: none; }
.map-side .now-open .stamp-btn { margin-top: 6px; }
.big-num { font-family: var(--type); font-size: 40px; margin: 0; }
.big-num span { font-family: var(--body); font-size: 16px; font-weight: 700; }

/* ---------- Case page ---------- */
.case-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 6px 0 18px; }
.case-head { transform: rotate(-0.4deg); padding-right: 200px; }
.case-head.boss { background: var(--ink); color: var(--paper); }
.case-head.boss .eyebrow { color: var(--yellow); }
.case-msg { font-size: 19px; }
.element { font-weight: 700; color: var(--muted); margin: 0; }
.phase-nav { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; margin-bottom: 8px; background: linear-gradient(var(--kraft) 80%, transparent); }
.phase-nav a { font-family: var(--type); font-size: 16px; text-decoration: none; color: var(--ink); background: rgba(244, 239, 230, 0.75); padding: 7px 12px 5px; }
.phase-nav a b { font-weight: 400; color: var(--red); }
.phase-nav a.on { background: var(--red); color: #fff; outline: 3px solid var(--ink); }
.phase-nav a.on b { color: #fff; }
.phase { margin: 0 0 34px; scroll-margin-top: 70px; }
.phase-title { display: inline-block; background: var(--ink); color: var(--paper); padding: 6px 14px 3px; font-size: 22px; }
.phase-band { background: var(--ink); color: var(--paper); padding: 12px 20px; margin-bottom: 16px; transform: rotate(0.3deg); }
.phase-band h2 { margin: 0; font-size: 24px; }
.phase-band p { margin: 2px 0 0; font-size: 15px; }
.phase .slide-frame { margin-bottom: 18px; box-shadow: var(--shadow); }
.phase.locked .phase-body { opacity: 0.35; filter: grayscale(1); pointer-events: none; max-height: 260px; overflow: hidden; }
.lock-note { font-weight: 700; background: var(--memo); padding: 10px 14px; display: inline-block; }
.check-msg { font-size: 18px; margin: -6px 0 18px; }
.inquiry { padding-left: 0; list-style: none; margin: 0; }
.inquiry label { display: flex; gap: 12px; font-weight: 400; margin: 8px 0; align-items: flex-start; }
.q { font-weight: 700; margin: 12px 0 4px; }
.a { white-space: pre-wrap; margin: 0 0 8px; }

/* capture */
.dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 120px; border: 3px dashed var(--ink); background: var(--paper-2); cursor: pointer; text-align: center; padding: 14px; font-weight: 700; margin: 14px 0 0; }
.dropzone.small { min-height: 70px; margin: 0; flex: 1; }
.dropzone.over { background: var(--memo); }
.dropzone.full { display: none; }
.evidence-board { display: flex; flex-wrap: wrap; gap: 22px; margin: 12px 0; }
.polaroid { position: relative; display: block; width: 180px; background: #fff; padding: 9px 9px 10px; box-shadow: 0 6px 12px rgba(60, 35, 10, 0.32); transform: rotate(var(--t, 0deg)); text-decoration: none; color: var(--ink); }
.polaroid img { display: block; width: 100%; height: 130px; object-fit: cover; }
.ev-doc { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 130px; background: #EDE6D8; gap: 4px; text-align: center; padding: 6px; }
.ev-doc b { font-family: var(--type); font-size: 26px; color: var(--red); }
.ev-doc small { font-size: 12px; word-break: break-all; }
.ev-cap { display: block; margin-top: 7px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-x { position: absolute; top: -10px; right: -10px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); font-weight: 700; cursor: pointer; }
.pop { animation: pop 0.25s ease-out; }
@keyframes pop { from { transform: scale(0.7) rotate(var(--t)); opacity: 0; } }
.lined-card.locked label, .lined-card.locked textarea, .lined-card.locked .row-actions { opacity: 0.4; }
.lined-card:not(.locked) .lock-note { display: none; }

/* verdict */
.verdict { position: relative; background: var(--memo); padding: 20px 24px; margin-bottom: 22px; box-shadow: var(--shadow); border-left: 8px solid var(--ink); padding-right: 200px; }
.verdict.approved { border-left-color: var(--ok); }
.verdict.try_again { border-left-color: var(--red); }
.verdict-msg { font-family: var(--type); font-size: 22px; }
.badge-line { display: flex; align-items: center; gap: 10px; }
.badge-ic { width: 46px; height: 46px; }
.bonus { font-weight: 700; color: var(--ok); }

/* ---------- Portfolio ---------- */
.folio { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 30px; align-items: start; }
.dossier { transform: rotate(-1deg); }
.dossier-rank { font-weight: 700; }
.xp-box { background: var(--ink); color: var(--paper); padding: 12px 14px; margin: 10px 0 16px; }
.xp-box div { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; }
.xp-box span { color: var(--yellow); }
.xp-box small { display: block; margin-top: 6px; }
.record { margin: 0 0 14px; }
.badges { display: flex; flex-wrap: wrap; gap: 10px; }
.badge { width: 88px; height: 88px; border-radius: 50%; border: 4px double var(--red); background: var(--paper-2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px; }
.badge svg { width: 40px; height: 40px; }
.badge small { font-size: 10px; line-height: 1.1; font-weight: 700; }
.files-title { margin-top: 0; }
.district-label { display: inline-block; background: var(--dc); color: #fff; padding: 6px 14px 3px; font-size: 18px; margin: 10px 0 18px; }
.case-file { transform: rotate(var(--t)); padding-right: 200px; }
.case-file .file-body { display: flex; flex-wrap: wrap; gap: 20px; }
.case-file .file-notes { flex: 1 1 260px; }
.case-file .evidence-board { margin: 0; }
.case-file h3 a { color: var(--ink); }
.memo.fb { margin: 10px 0 0; border-left: 5px solid var(--ink); }
.hot { color: var(--red); }
.exhibition { background: var(--ink); color: var(--paper); padding: 16px 22px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.exhibition b { font-family: var(--type); font-weight: 400; color: var(--yellow); font-size: 22px; }

/* ---------- Teacher pages ---------- */
.review-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.review .stamp-mark { position: static; }
.review.leaving { opacity: 0; transform: translateX(40px); transition: 0.4s; }
.badge-pick { border: 0; padding: 0; margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.badge-pick legend { font-weight: 700; margin-bottom: 6px; }
.badge-pick label { margin: 0; font-weight: 700; font-size: 14px; }
.badge-pick input { position: absolute; opacity: 0; }
.badge-pick span { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); padding: 4px 10px; background: var(--paper-2); cursor: pointer; min-height: 44px; }
.badge-pick svg { width: 28px; height: 28px; }
.badge-pick input:checked + span { background: var(--ink); color: var(--paper); }
.badge-pick input:focus-visible + span { outline: 3px solid var(--yellow); }
.district-panel { background: var(--paper); box-shadow: var(--shadow); margin-bottom: 26px; border-top: 10px solid var(--dc); }
.district-panel header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 16px 20px 10px; }
.district-panel header h2 { margin: 0; }
.district-panel header p { margin: 0; flex: 1 1 300px; font-size: 14px; }
.case-rows { border-top: 2px solid var(--ink); }
.case-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--rule); }
.case-row.draft { background: repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.03) 0 10px, transparent 10px 20px); }
.case-row h3 { margin: 0; font-size: 19px; }
.case-row p { margin: 2px 0 0; }
.cr-no { font-family: var(--type); font-size: 26px; color: var(--red); }
.cr-actions { display: flex; gap: 8px; }
.pad { padding: 4px 20px 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat { background: var(--paper); padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--type); font-size: 34px; font-weight: 400; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
th { border-bottom: 2px solid var(--ink); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.login-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.login-card { border: 2px dashed var(--ink); padding: 14px; background: #fff; }
.login-card p { margin: 0 0 4px; display: flex; flex-direction: column; }
.login-card span { font-size: 12px; color: var(--muted); }
.lc-brand { font-family: var(--type); color: var(--red); }
.lc-name { font-weight: 700; font-size: 18px; }
.lc-note { font-size: 12px; margin-top: 6px !important; }

/* ---------- Case builder ---------- */
.builder { display: flex; flex-direction: column; gap: 22px; }
.b-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; position: sticky; top: 0; z-index: 20; background: var(--kraft); padding: 10px 0; }
.b-top h1 { margin: 0; font-size: 30px; }
.b-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
.switch { display: inline-flex; gap: 8px; align-items: center; margin: 0; background: var(--paper); padding: 6px 12px; border: 2px solid var(--ink); }
.b-card { margin: 0; }
.b-sec { font-family: var(--type); font-size: 24px; margin: 0 0 6px; display: flex; gap: 10px; align-items: center; }
.b-sec.light { color: var(--paper); }
.b-sub { font-weight: 700; margin: 18px 0 8px; }
.b-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 16px; }
.b-grid .span2 { grid-column: span 2; }
.b-grid label.check { grid-column: span 4; margin-top: 16px; }
.b-strip-wrap { background: var(--ink); padding: 18px 20px; box-shadow: var(--shadow); }
.b-strip-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
.muted-light { color: #CFC8BC; margin: 0; }
.b-strip { display: flex; gap: 14px; overflow-x: auto; padding: 12px 2px 8px; align-items: flex-start; }
.thumb { flex: none; width: 196px; }
.thumb-btn { display: block; width: 100%; padding: 0; border: 3px solid #555; background: none; cursor: pointer; text-align: left; }
.thumb.on .thumb-btn { border-color: var(--yellow); }
.thumb-label { display: block; background: #2A2A2A; color: var(--paper); font-size: 13px; padding: 3px 8px; }
.thumb-label b { color: var(--yellow); }
.thumb-tools { display: flex; gap: 4px; margin-top: 6px; }
.thumb-tools button { flex: 1; min-height: 34px; font: inherit; font-size: 13px; font-weight: 700; background: var(--paper-2); border: 2px solid var(--paper-2); cursor: pointer; padding: 0 4px; }
.thumb-tools button:disabled { opacity: 0.35; cursor: default; }
.thumb-tools button[data-dup] { flex: 2; }
.add-slide { position: relative; flex: none; }
.add-btn { width: 170px; height: 110px; font: inherit; font-weight: 700; color: var(--yellow); background: transparent; border: 3px dashed var(--yellow); cursor: pointer; font-size: 18px; }
.add-menu { position: absolute; top: 116px; left: 0; z-index: 10; width: 220px; background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--red); }
.add-menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; font: inherit; font-weight: 700; border: 0; border-bottom: 1px solid var(--rule); background: none; cursor: pointer; }
.add-menu button:hover { background: var(--memo); }
.b-editor { outline: 4px solid var(--yellow); outline-offset: -2px; scroll-margin-top: 80px; }
.b-ed-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.b-ed { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.4fr); gap: 28px; align-items: start; }
.b-preview { position: sticky; top: 80px; }
.slide-frame.big { box-shadow: var(--shadow); border: 2px solid var(--ink); }
.opts { border: 0; padding: 0; margin: 14px 0 0; }
.opts legend { font-weight: 700; margin-bottom: 6px; }
.opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.photo-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.photo-row img { width: 90px; height: 60px; object-fit: cover; border: 2px solid var(--ink); }
.photo-btns { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 10px; max-height: 260px; overflow-y: auto; padding: 8px; background: #F1ECE2; border: 2px solid var(--rule); }
.lib-grid button { padding: 0; border: 2px solid var(--ink); background: #fff; cursor: pointer; height: 70px; }
.lib-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.g-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.g-tabs button { font: inherit; font-size: 13px; font-weight: 700; padding: 5px 10px; border: 2px solid var(--ink); background: var(--paper-2); cursor: pointer; min-height: 36px; }
.g-tabs button.on { background: var(--ink); color: var(--paper); }
.g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; padding: 8px; background: #F1ECE2; border: 2px solid var(--rule); }
.g-grid button { aspect-ratio: 1; padding: 4px; background: #fff; border: 1px solid #CCC; cursor: pointer; }
.g-grid button:hover { border-color: var(--red); }
.g-grid svg { width: 100%; height: 100%; display: block; }
.sticker-tools { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 10px; background: var(--memo); padding: 8px 12px; }
.sticker-tools label { margin: 0; display: flex; gap: 8px; align-items: center; }
.sticker-tools input[type=range] { width: 120px; }
.b-bottom { display: flex; justify-content: flex-end; }

/* ---------- Present ---------- */
body.presenting { background: #111; overflow: hidden; }
.present { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; }
.present-stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.present-frame { width: min(100vw, calc(100vh * 16 / 9)); cursor: pointer; }
.present-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 18px; background: rgba(17, 17, 17, 0.88); color: var(--paper); transition: opacity 0.3s; }
.present-bar.sleep { opacity: 0; }
.present-bar button { min-height: 44px; padding: 0 16px; font-family: var(--type); font-size: 18px; background: #333; color: var(--paper); border: 2px solid var(--paper); cursor: pointer; }
.present-bar button.red { background: var(--red); }
.p-timer { display: flex; gap: 8px; }
.p-help { margin-left: auto; font-size: 13px; color: #AAA; }

/* ---------- Overlay & toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(26, 26, 26, 0.75); display: flex; align-items: center; justify-content: center; padding: 20px; }
.overlay[hidden] { display: none; }
.stamp-dialog { background: var(--paper); padding: 40px 44px 30px; max-width: 520px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
.big-stamp { display: inline-block; font-family: var(--type); font-size: 48px; color: var(--red); border: 7px solid var(--red); padding: 8px 24px 2px; transform: rotate(-8deg); margin-bottom: 24px; }
.big-stamp.thud { animation: thud 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes thud { from { transform: rotate(-8deg) scale(2.6); opacity: 0; } }
.sd-line { font-size: 20px; font-weight: 700; }
.sd-small { color: var(--ok); font-weight: 700; }
.big-stamp-inline { font-family: var(--type); font-size: 34px; color: var(--ok); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; background: var(--ink); color: var(--paper); padding: 12px 20px; font-weight: 700; box-shadow: 4px 4px 0 var(--red); max-width: 90vw; }
.toast.warn { background: var(--memo); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }

/* =====================================================================
   SLIDES · drawn on a 1600 x 900 stage, scaled by --k
   ===================================================================== */
.slide-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--kraft); --k: 0.5; }
.slide-frame > .slide { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform: scale(var(--k)); transform-origin: 0 0; }
.slide {
  overflow: hidden; padding: 70px 90px; color: var(--ink); font-family: var(--body); font-size: 34px; line-height: 1.4;
  background-color: var(--kraft);
  background-image: radial-gradient(ellipse at 15% 15%, rgba(255, 240, 210, 0.45), transparent 45%), radial-gradient(ellipse at 85% 85%, rgba(120, 80, 40, 0.3), transparent 50%);
}
.slide.dark { background: #1A1A1A radial-gradient(ellipse at 50% 40%, rgba(179, 23, 15, 0.28), transparent 60%); color: var(--paper); }
.slide p { margin: 0 0 0.5em; }
.slide ul { margin: 0.2em 0 0.4em; padding-left: 1.2em; }
.slide li { margin-bottom: 0.2em; }
.s-tag { position: relative; z-index: 2; display: inline-block; background: var(--ink); color: var(--paper); font-family: var(--type); font-size: 30px; padding: 8px 20px 5px; letter-spacing: 0.05em; }
.s-tag.red { background: var(--red); }
.s-pin { position: absolute; top: -18px; left: 50%; margin-left: -18px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FF6B5E, var(--red) 60%, var(--red-dark)); box-shadow: 2px 5px 6px rgba(0, 0, 0, 0.3); z-index: 3; }
.s-h1 { font-family: var(--type); font-size: 140px; line-height: 0.95; margin: 0; }
.s-h1.light { color: var(--paper); font-size: 116px; margin: 36px 0 44px; }
.s-h2 { font-family: var(--type); font-size: 100px; line-height: 1; margin: 30px 0 34px; }
.s-tape { position: absolute; left: -40px; right: -40px; height: 54px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 44px, var(--ink) 44px 88px); }
.s-tape.top { top: 120px; transform: rotate(-3deg); }
.s-tape.thin { top: 34px; transform: rotate(-2deg); }
.s-title-block { position: absolute; left: 90px; right: 90px; top: 250px; }
.s-eyebrow { font-weight: 700; letter-spacing: 0.3em; font-size: 28px; margin: 0 0 18px !important; }
.s-redlabel { display: inline-block; background: var(--red); color: #fff; font-family: var(--type); font-size: 38px; padding: 12px 30px 8px; transform: rotate(-1.5deg); margin-top: 36px !important; }
.s-stamp { position: absolute; right: 110px; bottom: 110px; font-family: var(--type); font-size: 52px; color: var(--red); border: 7px solid var(--red); padding: 6px 24px 0; transform: rotate(-10deg); }
.s-stamp.xp { color: var(--red-bright); border-color: var(--red-bright); font-size: 64px; bottom: 70px; right: 100px; transform: rotate(-8deg); }
/* hook */
.s-hook { position: absolute; left: 90px; right: 90px; top: 190px; }
.s-hook-text { font-size: 46px; line-height: 1.4; max-width: 1300px; }
.s-quote { font-family: var(--type); font-size: 132px; line-height: 1; color: var(--red-bright); margin: 36px 0 0; transform: rotate(-1.5deg); }
.s-banner { position: absolute; left: 0; right: 0; bottom: 0; min-height: 190px; display: flex; align-items: center; padding: 20px 90px; background: var(--yellow); color: var(--ink); font-family: var(--type); font-size: 70px; line-height: 1.05; }
.s-timer { font-family: var(--type); color: var(--red-bright); }
.s-timer.corner { position: absolute; right: 90px; top: 58px; font-size: 100px; line-height: 1; }
.s-timer.block { background: var(--ink); text-align: center; font-size: 160px; line-height: 1; padding: 22px 10px; }
.s-timer.huge { font-size: 340px; line-height: 1; }
.s-timer.done { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
/* intel and question content with photo layouts */
.s-content { position: relative; z-index: 1; margin-top: 40px; max-width: 1420px; }
.s-paper { position: relative; background: var(--paper); padding: 50px 56px; box-shadow: 0 16px 34px rgba(60, 35, 10, 0.38); transform: rotate(-1.2deg); color: var(--ink); }
.s-paper .s-h2 { margin: 0 0 26px; font-size: 96px; }
.s-rich { font-size: 40px; line-height: 1.4; }
.s-content.lay-pin, .s-content.lay-sticker { max-width: 860px; }
.s-content.lay-half { max-width: 760px; }
.s-content.lay-bg { position: absolute; left: 90px; right: 90px; bottom: 70px; max-width: none; }
.s-content.lay-bg .s-paper { background: none; box-shadow: none; transform: none; padding: 0; color: var(--paper); }
.s-content.lay-bg .s-pin { display: none; }
.s-content.lay-bg .s-memo { background: none; box-shadow: none; color: var(--paper); border: 0; padding: 0; transform: none; }
.s-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.s-img.polaroid-big { position: absolute; right: 90px; top: 150px; width: 560px; background: #fff; padding: 20px 20px 16px; box-shadow: 0 18px 34px rgba(60, 35, 10, 0.4); transform: rotate(3.5deg); margin: 0; z-index: 1; }
.s-img.polaroid-big img { height: 470px; }
.s-img.polaroid-big .s-pin { top: -16px; }
.s-cap { display: block; text-align: center; font-family: var(--type); font-size: 34px; margin-top: 12px; color: var(--ink); }
.s-img.half { position: absolute; right: 0; top: 0; bottom: 0; width: 46%; border-left: 8px solid var(--ink); z-index: 0; }
.s-img.bg { position: absolute; inset: 0; z-index: 0; }
.slide.has-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(26, 26, 26, 0.92), rgba(26, 26, 26, 0.15) 70%); z-index: 0; pointer-events: none; }
.slide.has-bg .s-content { z-index: 2; }
.slide.has-bg .s-tag { z-index: 3; }
.s-img.round { position: absolute; right: 90px; bottom: 80px; width: 300px; height: 300px; border-radius: 50%; overflow: hidden; border: 12px solid var(--paper); box-shadow: 0 12px 24px rgba(60, 35, 10, 0.4); z-index: 1; }
.s-round-tape { position: absolute; right: 70px; bottom: 330px; width: 200px; height: 46px; background: rgba(242, 194, 0, 0.85); transform: rotate(-20deg); z-index: 2; }
/* pinned cards */
.s-cards { display: grid; gap: 34px; margin-top: 10px; }
.s-cards.n2 { grid-template-columns: repeat(2, 1fr); }
.s-cards.n3 { grid-template-columns: repeat(3, 1fr); }
.s-cards.n4 { grid-template-columns: repeat(4, 1fr); }
.s-card { position: relative; background: var(--paper); padding: 46px 28px 40px; text-align: center; box-shadow: 0 16px 30px rgba(60, 35, 10, 0.35); transform: rotate(var(--t)); display: flex; flex-direction: column; gap: 18px; min-height: 380px; justify-content: center; }
.s-card b { font-family: var(--type); font-weight: 400; color: var(--red); font-size: 110px; line-height: 1; }
.s-card span:last-child { font-weight: 700; font-size: 44px; line-height: 1.15; }
/* picture */
.s-picture { position: absolute; inset: 150px 90px 60px; display: flex; align-items: center; justify-content: center; }
.s-picture figure { margin: 0; background: #fff; padding: 24px 24px 18px; box-shadow: 0 18px 34px rgba(60, 35, 10, 0.4); transform: rotate(-1.5deg); max-height: 100%; display: flex; flex-direction: column; }
.s-picture img { max-height: 560px; max-width: 1300px; object-fit: contain; display: block; }
.s-picture figcaption { font-family: var(--type); font-size: 40px; text-align: center; margin-top: 12px; }
.s-empty { font-size: 40px; border: 6px dashed var(--ink); padding: 60px 80px; }
/* video */
.s-video { position: absolute; left: 200px; right: 200px; top: 160px; bottom: 70px; border: 8px solid var(--paper); background: #2A241F; }
.s-video iframe { width: 100%; height: 100%; border: 0; display: block; }
.s-video-ph { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; color: var(--kraft); font-size: 36px; text-align: center; padding: 40px; }
.s-video-ph a { color: var(--yellow); }
/* question / memo */
.s-memo { position: relative; background: var(--memo); color: var(--ink); padding: 50px 60px; border-top: 44px solid rgba(26, 26, 26, 0.85); transform: rotate(-1deg); box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35); }
.s-memo h1 { font-family: var(--type); font-weight: 400; font-size: 82px; line-height: 1.1; margin: 0; }
.s-memo .s-rich { margin-top: 26px; }
.s-question .s-content { margin-top: 70px; }
/* check */
.s-check-q { font-family: var(--body); font-weight: 700; font-size: 54px; line-height: 1.3; margin: 40px 0 44px; max-width: 1420px; }
.s-options { display: flex; flex-direction: column; gap: 24px; }
.s-opt { display: block; width: 100%; text-align: left; font: inherit; font-weight: 700; font-size: 44px; background: var(--paper); color: var(--ink); padding: 22px 34px; border: 0; box-shadow: 0 8px 16px rgba(60, 35, 10, 0.3); }
button.s-opt { cursor: pointer; }
button.s-opt:hover { background: var(--memo); }
.s-opt b { color: var(--red); margin-right: 14px; }
.s-opt.right { outline: 8px solid var(--ok); outline-offset: -8px; }
.s-opt.right .tick { color: var(--ok); }
.s-opt.wrong { outline: 8px solid var(--red); outline-offset: -8px; opacity: 0.7; }
.s-hint { position: absolute; left: 90px; bottom: 50px; font-size: 26px; font-weight: 700; color: var(--muted); }
/* timer slide */
.s-timer-full { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.s-timer-full h1 { font-family: var(--type); font-weight: 400; font-size: 90px; margin: 0; color: var(--paper); }
/* investigate */
.s-inv { display: flex; gap: 60px; margin-top: 80px; }
.s-inv-main { flex: 1.5; }
.s-inv-main .s-h2 { font-size: 88px; margin: 28px 0 30px; }
.s-steps { margin: 0; padding-left: 1.4em; font-size: 40px; font-weight: 700; line-height: 1.5; }
.s-inv-side { flex: 1; display: flex; flex-direction: column; gap: 28px; }
.s-inv-img { position: relative; height: 380px; }
.s-inv-img .s-img { position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; top: 0 !important; right: 0 !important; transform: rotate(2deg); border-left: 0; }
.s-inv-img .s-img img { height: 100%; }
.s-inv-img .s-img.polaroid-big img { height: 300px; }
/* debrief */
.s-debrief { display: flex; flex-direction: column; justify-content: center; height: 680px; }
.s-memo.tall { padding: 70px 70px; }
.s-memo.tall h1 { font-size: 92px; }
.s-after { margin-top: 40px !important; font-size: 40px; font-weight: 700; }
/* capture */
.s-capture { display: flex; gap: 46px; }
.s-note { position: relative; flex: 1; background: var(--paper); color: var(--ink); padding: 40px 44px; transform: rotate(-1.5deg); }
.s-note.memo { flex: 1.3; background: var(--memo); transform: rotate(1deg); }
.s-note b { display: block; font-family: var(--type); font-weight: 400; color: var(--red); font-size: 58px; margin-bottom: 14px; }
.s-note p { font-weight: 700; font-size: 40px; line-height: 1.35; }
.s-capture-go { position: absolute; left: 90px; bottom: 76px; color: var(--yellow); font-weight: 700; font-size: 34px; }
/* graphics on slides */
.s-sticker { position: absolute; z-index: 5; aspect-ratio: 1; pointer-events: none; }
.s-sticker svg { width: 100%; height: 100%; display: block; overflow: visible; }
.s-sticker.editable { pointer-events: auto; cursor: grab; touch-action: none; }
.s-sticker.editable:hover { outline: 4px dashed rgba(179, 23, 15, 0.6); }
.s-sticker.picked { outline: 6px solid var(--yellow); }

/* ---------- Phone and tablet ---------- */
@media (max-width: 1000px) {
  .map-layout, .folio, .b-ed { grid-template-columns: 1fr; }
  .city { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .b-preview { position: static; }
  .b-grid { grid-template-columns: 1fr 1fr; }
  .b-grid .span2, .b-grid label.check { grid-column: span 2; }
}
@media (max-width: 700px) {
  body { font-size: 16px; }
  .top { padding: 10px 16px; }
  .hud { margin-left: 0; width: 100%; }
  .page { padding: 6px 16px 60px; }
  .city { grid-template-columns: 1fr; padding: 30px 18px; gap: 34px; }
  .case-head, .verdict, .case-file { padding-right: 22px; }
  .case-head .stamp-mark, .verdict .stamp-mark, .case-file .stamp-mark { position: static; display: inline-block; margin-bottom: 10px; }
  .paper { padding: 20px 18px; }
  .folder-paper { padding: 26px 22px 22px; }
  .two-col { grid-template-columns: 1fr; }
  .case-row { grid-template-columns: 44px minmax(0, 1fr); }
  .cr-actions, .case-row .chip { grid-column: 2; justify-self: start; }
  .b-grid { grid-template-columns: 1fr; }
  .b-grid .span2, .b-grid label.check { grid-column: span 1; }
  .b-top { position: static; }
  .p-help { display: none; }
  .polaroid { width: 140px; }
  .polaroid img, .ev-doc { height: 100px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media print {
  body { background: #fff; }
  .top, .no-print, #add-form, .page-head, .stats, .table-wrap, form { display: none !important; }
  .paper { box-shadow: none; }
  .login-card { break-inside: avoid; }
}

/* AI feedback drafts (teacher only) */
.draft-note{margin:4px 0 6px;padding:8px 12px;background:#EEF3FF;border-left:4px solid #4A63B8;font-size:.9rem;line-height:1.4}
textarea.is-draft{background:#F7F9FF;border-style:dashed}

/* ---------- padlocks and twist cards ---------- */
.s-lock{position:absolute;inset:110px 90px 70px;display:flex;gap:60px;align-items:flex-start}
.s-lock-icon svg{width:190px;height:220px;filter:drop-shadow(0 10px 18px rgba(60,35,10,.35))}
.s-lock-main{flex:1;background:var(--paper,#F4EFE6);padding:40px 48px;box-shadow:0 16px 34px rgba(60,35,10,.35);transform:rotate(-.6deg)}

// ---------- Small helpers ----------------------------------------------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
    localStorage.setItem(key, JSON.stringify(value));
  } catch { /* storage blocked: ignore */ }
  return null;
}

function toast(msg, kind = 'ok') {

function friendlyError(err) {
  const m = err?.message || String(err);
  if (/Invalid login/i.test(m)) return 'That detective name or secret code doesn’t match. Check your login card.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Can’t reach Thrive City. Check your internet connection.';
  if (/duplicate key/i.test(m)) return 'That’s already been saved.';
  if (/slides_check|octet_length/i.test(m)) return 'This case has too much in it to save. Remove a slide or two.';

}

async function fetchAll(build) {
  const out = [];
  const size = 1000;
  for (let from = 0; ; from += size) {
    const { data, error } = await build().range(from, from + size - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < size) return out;
  }
}

}

// ---------- Files -------------------------------------------------------
const extOf = (name) => (String(name).split('.').pop() || '').toLowerCase();
const mimeFor = (file) => FILE_TYPES[extOf(file.name)] || file.type || '';
const showsAsImage = (type) => /^image\/(jpeg|png|webp|gif)$/.test(type || '');
const fileTag = (type) => (/pdf/.test(type) ? 'PDF' : /word/.test(type) ? 'DOC' : /presentation/.test(type) ? 'PPT' : /^image/.test(type) ? 'IMG' : 'FILE');

async function shrinkImage(file, maxSide = 1600) {
  const type = mimeFor(file);
  if (!/^image\/(jpeg|png|webp)$/.test(type)) return new File([file], file.name, { type });
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 400000) return new File([file], file.name, { type });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    const ctx = canvas.getContext('2d');
    if (type !== 'image/png') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const outType = type === 'image/png' ? 'image/png' : 'image/jpeg';
    const blob = await new Promise((r) => canvas.toBlob(r, outType, 0.84));
    if (!blob || blob.size >= file.size) return new File([file], file.name, { type });
    return new File([blob], file.name.replace(/\.\w+$/, '') + (outType === 'image/png' ? '.png' : '.jpg'), { type: outType });
  } catch {
    return new File([file], file.name, { type });
  }
}

async function signUrls(subs) {
  const paths = subs.flatMap((s) => (s.evidence || []).map((e) => e.path)).filter(Boolean);
  const out = {};
  for (let i = 0; i < paths.length; i += 100) {

    (data || []).forEach((d) => { if (d.signedUrl) out[d.path] = d.signedUrl; });

  return out;
}

  const tilt = [-3, 2, -1.5, 3];
  const items = (list || []).map((e, i) => {
    const u = urls[e.path];
    const inner = u && showsAsImage(e.type)
      ? `<img src="${esc(u)}" alt="${esc(e.name)}" loading="lazy">`
      : `<span class="ev-doc"><b>${fileTag(e.type)}</b><small>${esc(e.name)}</small></span>`;
    const body = `${inner}<span class="ev-cap">${esc(e.name)}</span>`;

      ? `<a class="polaroid" style="--t:${tilt[i % 4]}deg" href="${esc(u)}" target="_blank" rel="noopener noreferrer" data-view="${esc(u)}" data-vname="${esc(e.name)}" data-vtype="${esc(e.type || '')}">${body}</a>`
      : `<span class="polaroid" style="--t:${tilt[i % 4]}deg">${body}</span>`;

    (views[view] || teacherReview)(id, extra);
  } else {
    const views = { map: studentMap, case: studentCase, portfolio: studentPortfolio };
    (views[view] || studentMap)(id, extra);
  }
  window.scrollTo(0, 0);
}

// ---------- Teacher: see the site exactly as one student sees it -------
async function enterStudentView(id, keepPage) {
  const teacher = realMe || me;
  if (teacher.role !== 'teacher') return;
  viewList = await loadStudents();
  const s = viewList.find((x) => x.id === id) || viewList[0];
  if (!s) { toast('Add some students first.', 'warn'); return; }
  realMe = teacher;
  me = { ...s, role: 'student', viewing: true };
  try { sessionStorage.setItem('l2l-viewas', s.id); } catch {}
  if (!routing) {
    window.addEventListener('hashchange', route);
    routing = true;
  }
  const target = keepPage && /^#\/(map|case|portfolio)/.test(location.hash) ? location.hash : '#/map';
  if (location.hash === target) route(); else location.hash = target;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-viewas]');
  if (b) { e.preventDefault(); enterStudentView(b.dataset.viewas); }
});
function exitStudentView() {
  try { sessionStorage.removeItem('l2l-viewas'); } catch {}
  if (realMe) me = realMe;
  realMe = null;
  if (location.hash === '#/class') route(); else location.hash = '#/class';
}

async function logout() {
  try { sessionStorage.removeItem('l2l-viewas'); } catch {}
  realMe = null;
  leaveGuard = null;
  await sb.auth.signOut();
  me = null;
  location.hash = '';
  renderLogin();
}

  const isT = me.role === 'teacher';
  const tabs = isT

// ---------- padlock codes ----------------------------------------------------
// Codes are compared without spaces, punctuation or capitals. Students only ever
// get a scrambled (SHA-256) version, salted with the slide's own random id.
const normCode = (v) => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function codeHash(slideId, code) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`${slideId}:${normCode(code)}`));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

// ---------- Evidence viewer: click any piece of evidence to see it full size ----------
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-view]');
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  const board = a.closest('.evidence-board');
  const all = board ? [...board.querySelectorAll('[data-view]')] : [a];
  let i = all.indexOf(a);
  const box = document.createElement('div');
  box.className = 'viewer';
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  const show = () => {
    const el = all[i];
    const u = el.dataset.view; const name = el.dataset.vname || 'Evidence'; const type = el.dataset.vtype || '';
    const isImg = showsAsImage(type) || /\.(jpe?g|png|gif|webp|heic)$/i.test(name);
    const isPdf = /pdf/.test(type) || /\.pdf$/i.test(name);
    box.innerHTML = `<div class="viewer-bar"><b>${esc(name)}</b><span class="muted">${i + 1} of ${all.length}</span>
        <a class="stamp-btn small ghost" href="${esc(u)}" target="_blank" rel="noopener noreferrer" download>Open / download</a>
        <button type="button" class="stamp-btn small" data-vclose>Close ✕</button></div>
      <div class="viewer-stage">
        ${all.length > 1 ? '<button type="button" class="viewer-arrow prev" data-vprev aria-label="Previous">‹</button>' : ''}
        ${isImg ? `<img src="${esc(u)}" alt="${esc(name)}">` : isPdf ? `<iframe src="${esc(u)}" title="${esc(name)}"></iframe>`
          : `<div class="viewer-doc"><p>This file type can’t be shown here.</p><a class="stamp-btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open ${esc(name)}</a></div>`}
        ${all.length > 1 ? '<button type="button" class="viewer-arrow next" data-vnext aria-label="Next">›</button>' : ''}
      </div>`;
  };
  const close = () => { box.remove(); document.removeEventListener('keydown', key, true); a.focus(); };
  const key = (ev) => {
    if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
    if (ev.key === 'ArrowRight' && all.length > 1) { i = (i + 1) % all.length; show(); }
    if (ev.key === 'ArrowLeft' && all.length > 1) { i = (i - 1 + all.length) % all.length; show(); }
  };
  box.addEventListener('click', (ev) => {
    if (ev.target === box || ev.target.closest('[data-vclose]')) close();
    else if (ev.target.closest('[data-vnext]')) { i = (i + 1) % all.length; show(); }
    else if (ev.target.closest('[data-vprev]')) { i = (i - 1 + all.length) % all.length; show(); }
  });
  document.addEventListener('keydown', key, true);
  show();
  document.body.appendChild(box);
  box.querySelector('[data-vclose]').focus();
});

// ===== slides.js =====
// =====================================================================
// SLIDES · one lesson = a list of slides. The same drawing code is used
// for the projector, the builder preview and the students' case page.
// Every slide is drawn on a 1600 x 900 stage and scaled to fit.
// =====================================================================

const SLIDE_TYPES = {
  title:       { label: 'Title', phase: null, dark: false },
  hook:        { label: 'Hook', phase: 'hook', dark: true, minutes: 5 },
  intel:       { label: 'Intel card', phase: 'intel', dark: false },
  picture:     { label: 'Picture', phase: 'intel', dark: false },
  video:       { label: 'Video', phase: 'intel', dark: true },
  question:    { label: 'Turn and tell', phase: 'intel', dark: true },
  check:       { label: 'Quick check', phase: 'intel', dark: false },
  timer:       { label: 'Timer', phase: null, dark: true, minutes: 5 },
  investigate: { label: 'Investigate', phase: 'investigate', dark: false, minutes: 20 },
  debrief:     { label: 'Debrief', phase: 'debrief', dark: false, minutes: 10 },
  capture:     { label: 'Capture', phase: 'capture', dark: true, minutes: 5 },
  objectives:  { label: 'Mission objectives', phase: null, dark: false },
  lock:        { label: 'Padlock', phase: 'investigate', dark: false },
  twist:       { label: 'Plot twist', phase: null, dark: true },
};
const ADDABLE = ['lock', 'twist', 'objectives', 'intel', 'picture', 'video', 'question', 'check', 'timer', 'hook', 'investigate', 'debrief', 'title'];
const LAYOUTS = [['pin', 'Pinned photo'], ['half', 'Half and half'], ['bg', 'Full background'], ['sticker', 'Corner sticker']];

function newSlide(type, c = {}) {
  const s = { id: uid(), type, heading: '', text: '', stickers: [] };
  if (type === 'title') { s.heading = c.title || 'New case'; s.text = 'New case file opened'; }
  if (type === 'hook') { s.text = 'Witnesses report…'; s.heading = '“A quote or a mystery”'; s.question = 'The big question?'; s.minutes = 5; }
  if (type === 'intel') { s.heading = 'New intel'; s.text = 'Your teaching point.\n\nUse a line starting with - for each point, and 2 to 4 points become pinned cards:\n- First point\n- Second point'; }
  if (type === 'picture') { s.heading = 'Exhibit A'; }
  if (type === 'video') { s.heading = 'Surveillance footage'; s.url = ''; }
  if (type === 'question') { s.heading = 'Turn and tell: …?'; s.text = ''; }
  if (type === 'check') { s.heading = 'Which is right?'; s.options = ['Option A', 'Option B', 'Option C']; s.answer = 1; }
  if (type === 'timer') { s.heading = 'Crew time'; s.minutes = 5; }
  if (type === 'investigate') { s.heading = 'Investigate'; s.text = '- Open your crew envelope\n- Work through the clues\n- Crack the case'; s.minutes = 20; }
  if (type === 'debrief') { s.heading = 'What did your crew discover?'; s.text = 'Spokespeople, report in.'; s.minutes = 10; }
  if (type === 'capture') { s.heading = 'File your case notes'; s.minutes = 5; }
  if (type === 'lock') { s.heading = 'The first lock'; s.text = 'What crews need to work out to find the code.'; s.reward = 'What opens when they crack it.'; s.hint = ''; s.codeLen = 0; }
  if (type === 'objectives') { s.heading = 'By the end of this case you can:'; }
  if (type === 'twist') { s.heading = 'Plot twist'; s.text = 'For the next 2 minutes, only one person in each crew may speak.'; }
  return s;
}

// Older cases (made before slides existed) get a starter lesson built from what they have
function slidesFor(c) {
  if (Array.isArray(c.slides) && c.slides.length) return c.slides;
  const out = [newSlide('title', c)];
  const hook = newSlide('hook', c);
  hook.text = c.message || c.brief || 'A new case has landed on your desk.';
  hook.heading = '';
  hook.question = c.note || 'What do you think is going on?';
  out.push(hook);
  if (c.note || c.brief) {
    const intel = newSlide('intel', c);
    intel.heading = 'Intel';
    intel.text = c.brief || c.note;
    out.push(intel);
  }
  const inv = newSlide('investigate', c);
  inv.text = (c.steps || []).map((st) => `- ${st}`).join('\n') || inv.text;
  out.push(inv, newSlide('debrief', c), newSlide('capture', c));
  return out;
}

// ---------- text helpers --------------------------------------------------
function bulletsOf(t) {
  const lines = String(t || '').split('\n').map((l) => l.trim()).filter(Boolean);
  return lines.length && lines.every((l) => /^[-•*]\s+/.test(l)) ? lines.map((l) => l.replace(/^[-•*]\s+/, '')) : null;
}
function richText(t) {
  return String(t || '').split(/\n\s*\n/).map((block) => {
    const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return '';
    if (lines.every((l) => /^[-•*]\s+/.test(l))) return `<ul>${lines.map((l) => `<li>${esc(l.replace(/^[-•*]\s+/, ''))}</li>`).join('')}</ul>`;
    return `<p>${lines.map(esc).join('<br>')}</p>`;
  }).join('');
}
const fmtClock = (sec) => `${pad2(Math.floor(Math.max(0, sec) / 60))}:${pad2(Math.max(0, sec) % 60)}`;

function videoEmbed(url) {
  const u = safeUrl(url);
  if (!u) return null;
  let m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if (m) return `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0`;
  m = u.match(/vimeo\.com\/(\d+)/);
  if (m) return `https://player.vimeo.com/video/${m[1]}`;
  if (/canva\.com\/design\//.test(u)) return u.split('?')[0].replace(/\/(edit|view)$/, '/view') + '?embed';
  if (/docs\.google\.com\/presentation\//.test(u)) return u.replace(/\/(edit|pub|preview)[^]*$/, '/embed');
  return null;
}

// Numbers each slide's tag, e.g. INTEL FILE 2 OF 3
function slideTags(slides) {
  const totals = {};
  slides.forEach((s) => { totals[s.type] = (totals[s.type] || 0) + 1; });
  const seen = {};
  return slides.map((s) => {
    seen[s.type] = (seen[s.type] || 0) + 1;
    const n = seen[s.type];
    const of = totals[s.type];
    const t = SLIDE_TYPES[s.type] || {};
    const mins = s.minutes || t.minutes;
    switch (s.type) {
      case 'hook': return `HOOK${mins ? ` · ${mins} MIN` : ''}`;
      case 'intel': return of > 1 ? `INTEL FILE ${n} OF ${of}` : 'INTEL FILE';
      case 'picture': return 'EXHIBIT';
      case 'video': return 'SURVEILLANCE FOOTAGE';
      case 'question': return 'TURN AND TELL';
      case 'check': return 'INTEL CHECK';
      case 'investigate': return `INVESTIGATE${mins ? ` · ${mins} MIN` : ''}`;
      case 'debrief': return `DEBRIEF${mins ? ` · ${mins} MIN` : ''}`;
      case 'capture': return `CAPTURE${mins ? ` · ${mins} MIN` : ''}`;
      case 'timer': return 'CREW TIME';
      case 'lock': return of > 1 ? `PADLOCK ${n} OF ${of}` : 'PADLOCK';
      case 'twist': return 'BREAKING';
      case 'objectives': return 'MISSION OBJECTIVES';
      default: return '';
    }
  });
}

  const img = `<img src="${esc(url)}" alt="${esc(s.image.alt || '')}" draggable="false">`;
  const cap = s.image.caption ? `<span class="s-cap">${esc(s.image.caption)}</span>` : '';
  if (layout === 'half') return { layout, html: `<div class="s-img half">${img}</div>` };
  if (layout === 'bg') return { layout, html: `<div class="s-img bg">${img}</div>` };
  if (layout === 'sticker') return { layout, html: `<div class="s-img round">${img}</div><span class="s-round-tape"></span>` };

            ${!open && opts.mode === 'present' ? '<p class="s-hint">Crews enter the code on their device. Press Next to open the lock.</p>' : ''}
          </div></div>

  return `<div class="slide s-${esc(s.type)} ${dark ? 'dark' : ''} ${img.layout === 'bg' && ['intel', 'question'].includes(s.type) ? 'has-bg' : ''}" style="--dc:${d.col}">

function slideFrame(s, c, opts = {}, extraClass = '') {
  return `<div class="slide-frame ${extraClass}">${renderSlide(s, c, opts)}</div>`;

// Scale every slide to the width of its frame
const frameObserver = new ResizeObserver((entries) => {
  entries.forEach((e) => {
    const w = e.contentRect.width;
    const h = e.contentRect.height;
    const k = Math.min(w / 1600, h ? h / 900 : Infinity);
    e.target.style.setProperty('--k', k);
  });
});
function fitSlides(root = document) {
  $$('.slide-frame', root).forEach((f) => {
    const k = Math.min(f.clientWidth / 1600, f.clientHeight ? f.clientHeight / 900 : Infinity);
    f.style.setProperty('--k', k);
    frameObserver.observe(f);
  });
}

function padlockSvg(open) {
  return open
    ? '<svg viewBox="0 0 48 56" aria-hidden="true"><path d="M14 24V14a10 10 0 0 1 19.5-3" fill="none" stroke="#2F6B3A" stroke-width="5" stroke-linecap="round"/><rect x="6" y="24" width="36" height="28" rx="3" fill="#2F6B3A"/><circle cx="24" cy="37" r="4" fill="#F4EFE6"/></svg>'
    : '<svg viewBox="0 0 48 56" aria-hidden="true"><path d="M14 24V16a10 10 0 0 1 20 0v8" fill="none" stroke="#B3170F" stroke-width="5"/><rect x="6" y="24" width="36" height="28" rx="3" fill="#B3170F"/><circle cx="24" cy="36" r="4" fill="#F4EFE6"/><path d="M24 39v6" stroke="#F4EFE6" stroke-width="3" stroke-linecap="round"/></svg>';
}

const CREW_NAMES = ['Night Owls', 'Code Breakers', 'Sharp Eyes', 'The Lookouts', 'Cipher Squad', 'Silver Keys', 'Clue Crew',
  'The Decoders', 'Red Herrings', 'Fox Trackers', 'Bright Sparks', 'Moonlighters', 'Paper Trail', 'The Insiders'];
const CREW_ROLES = {
  3: ['Lead detective', 'Codebreaker', 'Recorder and spokesperson'],
  4: ['Lead detective', 'Codebreaker', 'Recorder', 'Spokesperson'],
  5: ['Lead detective', 'Codebreaker', 'Recorder', 'Spokesperson', 'Navigator'],
};
const ROLE_JOBS = {
  'Lead detective': 'keeps the crew moving and on time',
  Codebreaker: 'reads the clues aloud and tries the codes',
  Recorder: 'writes down what the crew works out',
  Spokesperson: 'reports back to the class',
  'Recorder and spokesperson': 'writes things down and reports back',
  Navigator: 'checks the instructions and the timer',
};
function roleFor(position, size, week) {
  const roles = CREW_ROLES[Math.max(3, Math.min(5, size))] || CREW_ROLES[4];
  return roles[((position + (week || 0)) % size + size) % size] || roles[0];
}

async function getSettings() {
  const { data } = await sb.from('app_settings').select('key, value');
  const s = { current_term: 1, survey_open: false };
  (data || []).forEach((r) => { s[r.key] = r.value; });
  s.current_term = Number(s.current_term) || 1;
  s.survey_open = s.survey_open === true;
  return s;
}
async function setSetting(key, value) {
  return sb.from('app_settings').upsert({ key, value, updated_at: new Date().toISOString() });
}

// ---------- the suggestion engine -----------------------------------------
// Every girl should have at least one person she picked in her crew. Girls who
// were picked least are placed first, then swaps improve the result.
function suggestCrews(students, prefs, size) {
  const ids = students.map((s) => s.id);
  const pick = {}; const avoid = {};
  ids.forEach((id) => { pick[id] = new Set(); avoid[id] = new Set(); });
  prefs.forEach((p) => {
    if (!pick[p.student_id]) return;
    (p.picks || []).forEach((x) => { if (pick[x]) pick[p.student_id].add(x); });
    if (p.avoid && pick[p.avoid]) { avoid[p.student_id].add(p.avoid); avoid[p.avoid].add(p.student_id); }
  });
  const pickedBy = {};
  ids.forEach((id) => { pickedBy[id] = 0; });
  ids.forEach((id) => pick[id].forEach((x) => { pickedBy[x]++; }));

  const n = ids.length;
  if (!n) return [];
  const k = Math.max(1, Math.round(n / size));
  const base = Math.floor(n / k);
  const caps = Array.from({ length: k }, (_, i) => base + (i < n % k ? 1 : 0));
  const crews = Array.from({ length: k }, () => []);
  const happy = (id, crew) => {
    let sc = 0;
    const mates = crew.filter((x) => x !== id);
    const mine = mates.filter((x) => pick[id].has(x)).length;
    if (pick[id].size) sc += mine ? 10 + 2 * mine : 0; else sc += 10;
    sc += mates.filter((x) => pick[x].has(id)).length;
    sc -= 100 * mates.filter((x) => avoid[id].has(x)).length;
    return sc;
  };
  const total = () => crews.reduce((a, c) => a + c.reduce((b, id) => b + happy(id, c), 0), 0);

  // place the least-picked girls first
  const order = [...ids].sort((a, b) => (pickedBy[a] - pickedBy[b]) || (Math.random() - 0.5));
  order.forEach((id) => {
    let best = -1; let bestScore = -Infinity;
    crews.forEach((c, i) => {
      if (c.length >= caps[i]) return;
      const sc = happy(id, [...c, id]) + c.reduce((a, x) => a + (pick[x].has(id) ? 3 : 0) - (avoid[x].has(id) ? 100 : 0), 0) - c.length * 0.5;
      if (sc > bestScore) { bestScore = sc; best = i; }
    });
    crews[best].push(id);
  });
  // improve with swaps
  let cur = total();
  for (let it = 0; it < 3000; it++) {
    const a = Math.floor(Math.random() * k); const b = Math.floor(Math.random() * k);
    if (a === b || !crews[a].length || !crews[b].length) continue;
    const i = Math.floor(Math.random() * crews[a].length); const j = Math.floor(Math.random() * crews[b].length);
    [crews[a][i], crews[b][j]] = [crews[b][j], crews[a][i]];
    const nx = total();
    if (nx >= cur) cur = nx; else [crews[a][i], crews[b][j]] = [crews[b][j], crews[a][i]];
  }
  return crews;
}

// How each girl sits in her crew: ok (has someone she picked), alone (nobody she picked), clash
function crewMarks(crew, prefsBy) {
  const out = {};
  crew.forEach((id) => {
    const p = prefsBy[id];
    const mates = crew.filter((x) => x !== id);
    const clash = mates.some((x) => p?.avoid === x || prefsBy[x]?.avoid === id);
    const has = p ? mates.some((x) => (p.picks || []).includes(x)) : null;
    out[id] = clash ? 'clash' : has === null ? 'none' : has ? 'ok' : 'alone';
  });
  return out;
}

// ---------- Teacher: Crews page -------------------------------------------
async function teacherCrews() {
  loadingPage('crews');
  try {
    const [settings, students, waiting] = await Promise.all([getSettings(), loadStudents(), waitingCount()]);
    const groups = groupsOf(students);
    let group = store('l2l-t-group') || '';
    if (!groups.includes(group)) group = groups[0] || '';
    const term = settings.current_term;
    const list = students.filter((s) => s.mentor_group === group);
    const byId = Object.fromEntries(list.map((s) => [s.id, s]));
    const { data: prefs } = await sb.from('crew_prefs').select('*').eq('term', term);
    const groupPrefs = (prefs || []).filter((p) => byId[p.student_id]);
    const prefsBy = Object.fromEntries(groupPrefs.map((p) => [p.student_id, p]));
    const { data: saved } = group ? await sb.from('crews').select('id, name, crew_members(student_id, position)').eq('mentor_group', group).eq('term', term).order('created_at') : { data: [] };

    let crews = (saved || []).map((c) => ({ name: c.name, ids: (c.crew_members || []).sort((a, b) => a.position - b.position).map((m) => m.student_id).filter((id) => byId[id]) }));
    let size = Number(store('l2l-crew-size')) || 4;
    let picked = null;
    let dirty = false;

    const unassigned = () => list.map((s) => s.id).filter((id) => !crews.some((c) => c.ids.includes(id)));
    const nameOf = (id) => byId[id]?.display_name || '?';

    const paint = () => {
      const marks = {};
      crews.forEach((c) => Object.assign(marks, crewMarks(c.ids, prefsBy)));
      const alone = Object.values(marks).filter((m) => m === 'alone').length;
      const clash = Object.values(marks).filter((m) => m === 'clash').length;
      const chip = (id) => `<button type="button" class="girl ${marks[id] || 'none'} ${picked === id ? 'picked' : ''}" data-girl="${id}" title="${{ ok: 'Has someone she picked', alone: 'Nobody she picked is in this crew', clash: 'Clash: someone here was named as hard to work with', none: 'Hasn’t done the survey' }[marks[id] || 'none']}">
        <span class="dot" aria-hidden="true"></span>${esc(nameOf(id))}</button>`;
      $('#crew-board').innerHTML = `
        ${crews.map((c, i) => `<section class="crew-card ${picked ? 'droppable' : ''}" data-crew="${i}">
          <input class="crew-name" data-name="${i}" maxlength="30" value="${esc(c.name)}" aria-label="Crew name">
          <div class="crew-girls">${c.ids.map(chip).join('') || '<p class="muted small">Empty</p>'}</div>
          ${picked ? '<p class="drop-here">Click to move her here</p>' : ''}
          <button type="button" class="link-btn danger small" data-delcrew="${i}">Remove crew</button>
        </section>`).join('')}
        <section class="crew-card unassigned ${picked ? 'droppable' : ''}" data-crew="-1">
          <p class="crew-name-fixed">Not in a crew yet <b>${unassigned().length}</b></p>
          <div class="crew-girls">${unassigned().map(chip).join('') || '<p class="muted small">Everyone has a crew.</p>'}</div>
        </section>`;
      $('#crew-summary').innerHTML = crews.length
        ? `${alone || clash ? `<span class="chip warn">${alone ? `${alone} girl${alone === 1 ? '' : 's'} without someone she picked` : ''}${alone && clash ? ' · ' : ''}${clash ? `${clash} clash${clash === 1 ? '' : 'es'}` : ''}</span>` : '<span class="chip ok">Every girl who did the survey has someone she picked</span>'}
           ${dirty ? '<span class="chip warn">Not saved</span>' : '<span class="chip">Saved</span>'}`

    });

      const g = e.target.closest('[data-girl]');

      if (e.target.closest('.crew-name')) return;
      if (g && (!picked || g.dataset.girl === picked)) { picked = picked === g.dataset.girl ? null : g.dataset.girl; paint(); return; }
      const card = e.target.closest('[data-crew]');
      if (picked && card) {
        crews.forEach((c) => { c.ids = c.ids.filter((x) => x !== picked); });
        const i = Number(card.dataset.crew);
        if (i >= 0) crews[i].ids.push(picked);
        picked = null; dirty = true; paint();
      }
    });
    $('#crew-board').addEventListener('input', (e) => {
      const n = e.target.closest('[data-name]');
      if (n) { crews[Number(n.dataset.name)].name = n.value; dirty = true; $('#crew-summary .chip:last-child').textContent = 'Not saved'; }
    });
    $('#save-crews').addEventListener('click', async () => {
      if (!group) return;
      const btn = $('#save-crews');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const { error: de } = await sb.from('crews').delete().eq('mentor_group', group).eq('term', term);
        if (de) throw de;
        for (const c of crews.filter((x) => x.ids.length)) {
          const { data: row, error } = await sb.from('crews').insert({ mentor_group: group, term, name: (c.name || 'Crew').trim().slice(0, 30) || 'Crew' }).select('id').single();
          if (error) throw error;
          const { error: me2 } = await sb.from('crew_members').insert(c.ids.map((id, pos) => ({ crew_id: row.id, student_id: id, position: pos })));
          if (me2) throw me2;
        }
        dirty = false; paint(); toast('Crews saved');
      } catch (err) { toast(friendlyError(err), 'warn'); }
      btn.disabled = false; btn.textContent = 'Save crews';
    });
  } catch (e) { errorPage('crews', e); }
}

function wireSurvey(rerender) {
  $('#survey-edit')?.addEventListener('click', () => { store('l2l-survey-edit', 1); rerender(); });
  const f = $('#survey-form');
  if (!f) return;
  f.addEventListener('change', (e) => {
    if (e.target.name !== 'pick') return;
    const on = $$('input[name="pick"]:checked', f);
    if (on.length > 3) { e.target.checked = false; toast('Three is the limit.', 'warn'); }
  });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const settings = await getSettings();
    const picks = $$('input[name="pick"]:checked', f).map((x) => x.value).slice(0, 3);
    const avoid = $('#avoid', f).value || null;
    if (avoid && picks.includes(avoid)) return toast('You picked that person to work with too. Check your answers.', 'warn');
    const { error } = await sb.from('crew_prefs').upsert({ student_id: me.id, term: settings.current_term, picks, avoid, updated_at: new Date().toISOString() });
    if (error) return toast(friendlyError(error), 'warn');
    store('l2l-survey-edit', null);
    toast('Sent. Only your teachers can see it.');
    rerender();
  });
}

// ---------- Projector: live crew scoreboard --------------------------------
async function crewBoardHtml(c, slides, group) {
  const locks = slides.filter((s) => s.type === 'lock');
  const settings = await getSettings();
  const { data: crews } = await sb.from('crews').select('id, name').eq('mentor_group', group).eq('term', settings.current_term);
  if (!crews?.length) return `<div class="board-empty"><h1>No crews yet for ${esc(group)}</h1><p>Make them on the Crews page.</p></div>`;
  const { data: prog } = await sb.from('crew_progress').select('crew_id, slide_id, cracked_at').eq('challenge_id', c.id).in('crew_id', crews.map((x) => x.id));
  const rows = crews.map((cr) => {
    const mine = (prog || []).filter((p) => p.crew_id === cr.id);
    const done = locks.filter((l) => mine.some((p) => p.slide_id === l.id)).length;
    const last = mine.reduce((a, p) => (p.cracked_at > a ? p.cracked_at : a), '');
    return { ...cr, done, last };
  }).sort((a, b) => (b.done - a.done) || (a.last && b.last ? a.last.localeCompare(b.last) : 0) || a.name.localeCompare(b.name));
  return `<div class="board">
    <h1 class="board-title">CREW BOARD</h1><p class="board-sub">${esc(c.title)} · ${esc(group)}</p>
    <ol class="board-rows">${rows.map((r) => `<li class="${r.done === locks.length && locks.length ? 'all' : ''}">
      <span class="b-name">${esc(r.name)}</span>
      <span class="b-locks">${locks.map((l, i) => `<span class="b-lock ${(prog || []).some((p) => p.crew_id === r.id && p.slide_id === l.id) ? 'open' : ''}" title="Lock ${i + 1}">${padlockSvg((prog || []).some((p) => p.crew_id === r.id && p.slide_id === l.id))}</span>`).join('')}</span>
      <span class="b-count">${r.done}/${locks.length}</span>
      ${r.done === locks.length && locks.length ? '<span class="b-stamp">CRACKED</span>' : ''}
    </li>`).join('')}</ol></div>`;
}

async function refreshMe() {
  const { data } = await sb.from('profiles').select('*').eq('id', me.id).single();

async function loadMySubmissions(studentId = me.id) {
  const { data, error } = await sb.from('submissions')
    .select('*, challenge:challenges(id, title, element, prompts, xp, week, district, location, closed_msg, reopen_msg, boss)')
    .eq('student_id', studentId)
    .order('created_at', { ascending: false });
  if (error) throw error;
  return data;
}

const byWeek = (a, b) => (a.week ?? 99) - (b.week ?? 99) || String(a.created_at).localeCompare(String(b.created_at));

function caseState(sub) {
  if (!sub) return 'open';
  if (sub.status === 'approved') return 'closed';
  if (sub.status === 'try_again') return 'reopened';
  return 'filed';
}
const STATE_LABEL = { open: 'NEW CASE', closed: 'CASE CLOSED', reopened: 'REOPENED', filed: 'WITH TEACHER', current: 'YOU ARE HERE' };

        }).join('')}

      </nav>
      <div class="map-layout">

          ${list.length ? '<div class="loc classified" data-loc aria-hidden="true"><p class="loc-no">NEXT CASE</p><h3>CLASSIFIED</h3><span class="loc-st">LOCKED</span></div>' : ''}
